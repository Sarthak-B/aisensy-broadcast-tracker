name: Test AiSensy Campaign Analytics

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Inspect AiSensy Campaigns
        env:
          AISENSY_SESSION: ${{ secrets.AISENSY_SESSION }}
        run: |
          python - <<'PY'
          import json
          import os
          from playwright.sync_api import sync_playwright

          state = json.loads(os.environ["AISENSY_SESSION"])

          dashboard = (
              "https://www.app.aisensy.com/projects/"
              "6589906ef69fc70b424e0e43/dashboard"
          )

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(storage_state=state)
              page = context.new_page()

              page.goto(
                  dashboard,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(5000)

              if "/login" in page.url:
                  raise RuntimeError(
                      "Session expired. Please refresh AISENSY_SESSION."
                  )

              print("Authenticated dashboard loaded.")

              # Find the Campaigns navigation item
              campaigns = page.get_by_text(
                  "Campaigns",
                  exact=True
              )

              print("Campaigns matches:", campaigns.count())

              if campaigns.count() == 0:
                  raise RuntimeError(
                      "Campaigns navigation item not found."
                  )

              # Click Campaigns
              campaigns.first.click(timeout=15000)

              page.wait_for_timeout(8000)

              print("Campaigns page URL:", page.url)

              # Print visible campaign-related text
              body = page.locator("body").inner_text(
                  timeout=15000
              )

              print("\n--- CAMPAIGNS PAGE PREVIEW ---")

              # Avoid dumping the entire page into logs.
              print(body[:3500])

              print("--- END PREVIEW ---")

              browser.close()
          PY
