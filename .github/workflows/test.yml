name: Test AiSensy Broadcast Details

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Inspect Broadcast Details
        env:
          AISENSY_SESSION: ${{ secrets.AISENSY_SESSION }}
        run: |
          python - <<'PY'
          import json
          import os
          from playwright.sync_api import sync_playwright

          state = json.loads(os.environ["AISENSY_SESSION"])

          url = (
              "https://www.app.aisensy.com/projects/"
              "6589906ef69fc70b424e0e43/campaigns/all"
          )

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              context = browser.new_context(
                  storage_state=state,
                  viewport={"width": 1440, "height": 900}
              )

              page = context.new_page()

              page.goto(
                  url,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.get_by_text(
                  "10amremi",
                  exact=True
              ).first.wait_for(timeout=30000)

              print("Campaign found: 10amremi")

              campaign = page.get_by_text(
                  "10amremi",
                  exact=True
              ).first

              campaign.click(timeout=15000)

              page.wait_for_timeout(8000)

              print("Details page URL:", page.url)

              body = page.locator("body").inner_text(
                  timeout=15000
              )

              print("\n--- BROADCAST DETAILS ---")

              # Print only a limited preview.
              # Check for private data before sharing logs.
              print(body[:5000])

              print("--- END DETAILS ---")

              browser.close()
          PY
