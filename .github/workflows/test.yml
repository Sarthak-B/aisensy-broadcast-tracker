name: Test AiSensy Dashboard

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test AiSensy Dashboard
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          url = (
              "https://www.app.aisensy.com/projects/"
              "6589906ef69fc70b424e0e43/dashboard"
          )

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              try:
                  print("Opening AiSensy dashboard...")

                  response = page.goto(
                      url,
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  page.wait_for_timeout(10000)

                  print("HTTP status:",
                        response.status if response else "Unknown")

                  print("Final URL:", page.url)
                  print("Page title:", page.title())

                  print("Visible page text:")
                  print(page.locator("body").inner_text()[:1000])

                  print("Dashboard access test completed.")

              except Exception as e:
                  print("ERROR:", str(e))
                  raise

              finally:
                  browser.close()
          PY
