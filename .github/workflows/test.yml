name: Test AiSensy Page

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Inspect AiSensy Page
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              print("Opening AiSensy...")

              page.goto(
                  "https://backend.aisensy.com",
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(10000)

              print("Final URL:", page.url)
              print("Page title:", page.title())

              print("Visible page text:")
              print(page.locator("body").inner_text(timeout=10000)[:1500])

              print("Page inspection completed.")

              browser.close()
          PY
