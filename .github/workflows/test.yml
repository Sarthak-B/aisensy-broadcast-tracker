name: Sync AiSensy Broadcasts to Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: read

concurrency:
  group: aisensy-google-sheets-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright google-api-python-client google-auth
          python -m playwright install --with-deps chromium

      - name: Fetch latest 5 and rebuild Google Sheets
        env:
          AISENSY_SESSION: ${{ secrets.AISENSY_SESSION }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}

        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone

          from playwright.sync_api import sync_playwright
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          PROJECT_ID = "6589906ef69fc70b424e0e43"

          BASE_URL = (
              "https://www.app.aisensy.com/projects/"
              + PROJECT_ID
          )

          CAMPAIGNS_URL = BASE_URL + "/campaigns/all"

          LIMIT = 5

          REQUIRED_SECRETS = [
              "AISENSY_SESSION",
              "GOOGLE_SERVICE_ACCOUNT_JSON",
              "GOOGLE_SHEET_ID",
          ]

          for secret_name in REQUIRED_SECRETS:
              if not os.environ.get(secret_name):
                  raise RuntimeError(
                      "Missing GitHub secret or variable: "
                      + secret_name
                  )

          session = json.loads(
              os.environ["AISENSY_SESSION"]
          )

          google_credentials = json.loads(
              os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]
          )

          sheet_id = os.environ["GOOGLE_SHEET_ID"]

          credentials = service_account.Credentials.from_service_account_info(
              google_credentials,
              scopes=[
                  "https://www.googleapis.com/auth/spreadsheets"
              ],
          )

          service = build(
              "sheets",
              "v4",
              credentials=credentials,
              cache_discovery=False,
          )

          sheets_api = service.spreadsheets()

          now = datetime.now(timezone.utc).isoformat()

          def metric(text, label):
              match = re.search(
                  rf"(?mi)^\s*{re.escape(label)}\s*\n\s*([\d,]+)\s*$",
                  text,
              )

              if match:
                  return int(
                      match.group(1).replace(",", "")
                  )

              return None

          def actual_cost(text):
              match = re.search(
                  r"Total Credit Usage\s*\n\s*₹\s*([\d,]+(?:\.\d+)?)",
                  text,
                  re.IGNORECASE,
              )

              if match:
                  return float(
                      match.group(1).replace(",", "")
                  )

              return None

          def failed_count(text):
              match = re.search(
                  r"(?i)(?:\d+(?:\.\d+)?%\s*)?"
                  r"\(\s*([\d,]+)\s*\)\s*Failed\b",
                  text,
              )

              if match:
                  return int(
                      match.group(1).replace(",", "")
                  )

              return metric(text, "Failed")

          def get_campaign_names(page):
              page.goto(
                  CAMPAIGNS_URL,
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              page.get_by_text(
                  "Rows per page:",
                  exact=False,
              ).wait_for(timeout=45000)

              body = page.locator("body").inner_text()

              if "Campaign" not in body:
                  raise RuntimeError(
                      "AiSensy campaign list did not load."
                  )

              # Read the rendered campaign-list text.
              # AiSensy uses clickable elements rather than
              # ordinary HTML table links.

              lines = [
                  line.strip()
                  for line in body.splitlines()
                  if line.strip()
              ]

              names = []

              for index, line in enumerate(lines):
                  if line.upper() != "BROADCAST":
                      continue

                  if index == 0:
                      continue

                  name = lines[index - 1]

                  if name in (
                      "Campaign",
                      "Type",
                      "Broadcast",
                      "BROADCAST",
                  ):
                      continue

                  if name not in names:
                      names.append(name)

                  if len(names) >= LIMIT:
                      break

              if len(names) < LIMIT:
                  raise RuntimeError(
                      "Only found "
                      + str(len(names))
                      + " broadcast names. "
                      + "Expected 5. Existing sheet data preserved."
                  )

              print(
                  "Discovered latest broadcasts:",
                  ", ".join(names),
              )

              return names

          def open_campaign(page, name):
              page.goto(
                  CAMPAIGNS_URL,
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              page.get_by_text(
                  "Rows per page:",
                  exact=False,
              ).wait_for(timeout=45000)

              # Select the exact campaign name, not a
              # partial match against another campaign.

              campaign = page.get_by_text(
                  name,
                  exact=True,
              ).first

              campaign.wait_for(timeout=20000)

              campaign.click(timeout=20000)

              page.wait_for_url(
                  re.compile(
                      r"/campaigns/all/view/[^/?#]+"
                  ),
                  timeout=30000,
              )

              page.get_by_text(
                  "Total Credit Usage",
                  exact=True,
              ).first.wait_for(timeout=30000)

              return page.url

          def extract_campaign(page, name):
              url = open_campaign(page, name)

              campaign_id = url.rstrip("/").split("/")[-1]

              body = page.locator("body").inner_text()

              audience = metric(body, "Audience")
              sent = metric(body, "Sent")
              delivered = metric(body, "Delivered")
              read = metric(body, "Read")
              failed = failed_count(body)
              cost = actual_cost(body)

              required = {
                  "Audience": audience,
                  "Sent": sent,
                  "Delivered": delivered,
                  "Read": read,
                  "Failed": failed,
                  "Actual Cost": cost,
              }

              missing = [
                  key
                  for key, value in required.items()
                  if value is None
              ]

              if missing:
                  raise RuntimeError(
                      "Missing analytics for "
                      + name
                      + ": "
                      + ", ".join(missing)
                      + ". Existing sheet data preserved."
                  )

              date_match = re.search(
                  r"Created At\s*\n\s*"
                  r"([A-Za-z]{3}\s+\d{1,2},\s+\d{4})",
                  body,
              )

              if date_match:
                  date_value = datetime.strptime(
                      date_match.group(1),
                      "%b %d, %Y",
                  ).strftime("%Y-%m-%d")
              else:
                  raise RuntimeError(
                      "Campaign date missing for "
                      + name
                  )

              campaign_type = "BROADCAST"

              row = {
                  "id": campaign_id,
                  "name": name,
                  "date": date_value,
                  "type": campaign_type,
                  "audience": audience,
                  "sent": sent,
                  "delivered": delivered,
                  "read": read,
                  "failed": failed,
                  "cost": cost,
              }

              print(
                  name,
                  "| sent:", sent,
                  "| delivered:", delivered,
                  "| read:", read,
                  "| failed:", failed,
                  "| INR:", cost,
              )

              return row

          # ----------------------------------------
          # STEP 1: FETCH AND VALIDATE ALL 5
          # ----------------------------------------

          campaigns = []

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  storage_state=session
              )

              page = context.new_page()

              try:
                  names = get_campaign_names(page)

                  for name in names:
                      campaigns.append(
                          extract_campaign(page, name)
                      )

              finally:
                  browser.close()

          if len(campaigns) != LIMIT:
              raise RuntimeError(
                  "Expected exactly 5 campaigns. "
                  "Existing sheet data preserved."
              )

          campaign_ids = [
              item["id"]
              for item in campaigns
          ]

          if len(set(campaign_ids)) != LIMIT:
              raise RuntimeError(
                  "Duplicate campaign IDs detected. "
                  "Existing sheet data preserved."
              )

          print("Successfully fetched all 5 campaigns.")

          # ----------------------------------------
          # STEP 2: BUILD BROADCAST_DATA
          # ----------------------------------------

          broadcast_headers = [
              "Campaign ID",
              "Campaign Name",
              "Date",
              "Campaign Type",
              "Audience Size",
              "Sent",
              "Delivered",
              "Read",
              "Failed",
              "Delivery Rate",
              "Read Rate",
              "Cost per Message",
              "Estimated Cost",
              "Actual Cost",
              "Last Updated",
          ]

          broadcast_rows = [
              broadcast_headers
          ]

          for item in campaigns:
              sent = item["sent"]
              delivered = item["delivered"]
              read = item["read"]

              delivery_rate = (
                  delivered / sent
                  if sent
                  else 0
              )

              read_rate = (
                  read / delivered
                  if delivered
                  else 0
              )

              broadcast_rows.append([
                  item["id"],
                  item["name"],
                  item["date"],
                  item["type"],
                  item["audience"],
                  sent,
                  delivered,
                  read,
                  item["failed"],
                  delivery_rate,
                  read_rate,
                  "",
                  "",
                  item["cost"],
                  now,
              ])

          # ----------------------------------------
          # STEP 3: BUILD COST SUMMARY
          # ----------------------------------------

          total_sent = sum(
              item["sent"]
              for item in campaigns
          )

          total_delivered = sum(
              item["delivered"]
              for item in campaigns
          )

          total_read = sum(
              item["read"]
              for item in campaigns
          )

          total_failed = sum(
              item["failed"]
              for item in campaigns
          )

          total_audience = sum(
              item["audience"]
              for item in campaigns
          )

          total_cost = sum(
              item["cost"]
              for item in campaigns
          )

          cost_rows = [
              [
                  "Campaign Name",
                  "Date",
                  "Audience",
                  "Sent",
                  "Delivered",
                  "Read",
                  "Failed",
                  "Actual Cost (INR)",
                  "Cost per Sent Message",
              ]
          ]

          for item in campaigns:
              cost_per_sent = (
                  item["cost"] / item["sent"]
                  if item["sent"]
                  else 0
              )

              cost_rows.append([
                  item["name"],
                  item["date"],
                  item["audience"],
                  item["sent"],
                  item["delivered"],
                  item["read"],
                  item["failed"],
                  item["cost"],
                  cost_per_sent,
              ])

          cost_rows.append([
              "TOTAL",
              "",
              total_audience,
              total_sent,
              total_delivered,
              total_read,
              total_failed,
              total_cost,
              (
                  total_cost / total_sent
                  if total_sent
                  else 0
              ),
          ])

          # ----------------------------------------
          # STEP 4: BUILD DASHBOARD
          # ----------------------------------------

          delivery_rate = (
              total_delivered / total_sent
              if total_sent
              else 0
          )

          read_rate = (
              total_read / total_delivered
              if total_delivered
              else 0
          )

          dashboard_rows = [
              ["Metric", "Value"],
              ["Total Broadcasts", LIMIT],
              ["Total Audience", total_audience],
              ["Total Messages Sent", total_sent],
              ["Total Messages Delivered", total_delivered],
              ["Total Messages Read", total_read],
              ["Total Messages Failed", total_failed],
              ["Total Actual Cost (INR)", total_cost],
              ["Overall Delivery Rate", delivery_rate],
              ["Overall Read Rate", read_rate],
              ["Last Updated (UTC)", now],
              [],
              ["LATEST 5 BROADCASTS"],
              [
                  "Campaign",
                  "Sent",
                  "Delivered",
                  "Read",
                  "Failed",
                  "Cost (INR)",
              ],
          ]

          for item in campaigns:
              dashboard_rows.append([
                  item["name"],
                  item["sent"],
                  item["delivered"],
                  item["read"],
                  item["failed"],
                  item["cost"],
              ])

          # ----------------------------------------
          # STEP 5: CHECK GOOGLE SHEETS TABS
          # ----------------------------------------

          metadata = sheets_api.get(
              spreadsheetId=sheet_id,
              fields="sheets(properties(sheetId,title))",
          ).execute()

          tabs = {
              sheet["properties"]["title"]:
              sheet["properties"]["sheetId"]
              for sheet in metadata["sheets"]
          }

          required_tabs = [
              "Broadcast_Data",
              "Cost Summary",
              "Dashboard",
          ]

          for tab in required_tabs:
              if tab not in tabs:
                  raise RuntimeError(
                      "Missing Google Sheets tab: "
                      + tab
                      + ". Existing data preserved."
                  )

          # ----------------------------------------
          # STEP 6: REPLACE OLD DATA
          # ----------------------------------------

          # All 5 campaigns were fetched successfully
          # before reaching this point.

          clear_ranges = [
              "'Broadcast_Data'!A:O",
              "'Cost Summary'!A:I",
              "'Dashboard'!A:K",
          ]

          sheets_api.values().batchClear(
              spreadsheetId=sheet_id,
              body={
                  "ranges": clear_ranges
              },
          ).execute()

          sheets_api.values().batchUpdate(
              spreadsheetId=sheet_id,
              body={
                  "valueInputOption": "RAW",
                  "data": [
                      {
                          "range": "'Broadcast_Data'!A1",
                          "values": broadcast_rows,
                      },
                      {
                          "range": "'Cost Summary'!A1",
                          "values": cost_rows,
                      },
                      {
                          "range": "'Dashboard'!A1",
                          "values": dashboard_rows,
                      },
                  ],
              },
          ).execute()

          # ----------------------------------------
          # STEP 7: APPLY NUMBER FORMATTING
          # ----------------------------------------

          def format_range(
              tab,
              start_row,
              end_row,
              start_col,
              end_col,
              number_type,
              pattern,
          ):
              return {
                  "repeatCell": {
                      "range": {
                          "sheetId": tabs[tab],
                          "startRowIndex": start_row,
                          "endRowIndex": end_row,
                          "startColumnIndex": start_col,
                          "endColumnIndex": end_col,
                      },
                      "cell": {
                          "userEnteredFormat": {
                              "numberFormat": {
                                  "type": number_type,
                                  "pattern": pattern,
                              }
                          }
                      },
                      "fields": (
                          "userEnteredFormat.numberFormat"
                      ),
                  }
              }

          formatting_requests = []

          formatting_requests.append(
              format_range(
                  "Broadcast_Data",
                  1, 6, 9, 11,
                  "PERCENT",
                  "0.00%",
              )
          )

          formatting_requests.append(
              format_range(
                  "Broadcast_Data",
                  1, 6, 13, 14,
                  "CURRENCY",
                  '"₹"#,##0.00',
              )
          )

          formatting_requests.append(
              format_range(
                  "Cost Summary",
                  1, 7, 7, 9,
                  "CURRENCY",
                  '"₹"#,##0.00',
              )
          )

          formatting_requests.append(
              format_range(
                  "Dashboard",
                  8, 10, 1, 2,
                  "PERCENT",
                  "0.00%",
              )
          )

          formatting_requests.append(
              format_range(
                  "Dashboard",
                  7, 8, 1, 2,
                  "CURRENCY",
                  '"₹"#,##0.00',
              )
          )

          formatting_requests.append(
              format_range(
                  "Dashboard",
                  14, 19, 5, 6,
                  "CURRENCY",
                  '"₹"#,##0.00',
              )
          )

          # Bold headers in each tab.

          for tab, header_rows in [
              ("Broadcast_Data", [0]),
              ("Cost Summary", [0, 6]),
              ("Dashboard", [0, 12, 13]),
          ]:
              for header_row in header_rows:
                  formatting_requests.append({
                      "repeatCell": {
                          "range": {
                              "sheetId": tabs[tab],
                              "startRowIndex": header_row,
                              "endRowIndex": header_row + 1,
                          },
                          "cell": {
                              "userEnteredFormat": {
                                  "textFormat": {
                                      "bold": True
                                  }
                              }
                          },
                          "fields": (
                              "userEnteredFormat.textFormat.bold"
                          ),
                      }
                  })

          sheets_api.batchUpdate(
              spreadsheetId=sheet_id,
              body={
                  "requests": formatting_requests
              },
          ).execute()

          print("----------------------------------")
          print("GOOGLE SHEETS UPDATED SUCCESSFULLY")
          print("----------------------------------")
          print("Broadcasts:", len(campaigns))
          print("Total sent:", total_sent)
          print("Total delivered:", total_delivered)
          print("Total read:", total_read)
          print("Total failed:", total_failed)
          print("Total actual cost: INR", round(total_cost, 3))
          print("Updated tabs:")
          print("- Broadcast_Data")
          print("- Cost Summary")
          print("- Dashboard")
          print("----------------------------------")
          PY
