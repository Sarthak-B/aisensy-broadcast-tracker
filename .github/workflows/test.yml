name: Export AiSensy Broadcast Analytics

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright google-auth google-api-python-client
          python -m playwright install --with-deps chromium

      - name: Discover campaigns and update Google Sheets
        env:
          AISENSY_SESSION: ${{ secrets.AISENSY_SESSION }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from playwright.sync_api import sync_playwright

          PROJECT_ID = "6589906ef69fc70b424e0e43"
          BASE = f"https://www.app.aisensy.com/projects/{PROJECT_ID}"
          LIST_URL = BASE + "/campaigns/all"
          SHEET = "Broadcast_Data"

          # Test the first five campaigns before scaling up.
          MAX_CAMPAIGNS = 5

          def metric(lines, label):
              values = []

              for i, line in enumerate(lines[:-1]):
                  if line.lower() == label.lower():
                      value = lines[i + 1]

                      if re.fullmatch(r"[\d,]+", value):
                          values.append(
                              int(value.replace(",", ""))
                          )

              if not values:
                  raise ValueError(f"Missing metric: {label}")

              return values[-1]

          def actual_cost(lines):
              for i, line in enumerate(lines[:-1]):
                  if line == "Total Credit Usage":
                      match = re.fullmatch(
                          r"₹\s*([\d,]+(?:\.\d+)?)",
                          lines[i + 1]
                      )

                      if match:
                          return float(
                              match.group(1).replace(",", "")
                          )

              raise ValueError("Missing Total Credit Usage")

          def actual_failed(text):
              patterns = [
                  r"\(\s*([\d,]+)\s*\)\s*Failed\b",
                  r"\bFailed\s*\(\s*([\d,]+)\s*\)",
                  r"\bFailed\s*\n\s*([\d,]+)\s*(?:\n|$)",
              ]

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      text,
                      re.IGNORECASE
                  )

                  if match:
                      return int(
                          match.group(1).replace(",", "")
                      )

              raise ValueError("Missing actual Failed count")

          def field_after(lines, label):
              for i, line in enumerate(lines[:-1]):
                  if line.lower() == label.lower():
                      return lines[i + 1]

              return ""

          def campaign_date(lines):
              value = field_after(lines, "Created At")

              if not value:
                  return ""

              try:
                  parsed = datetime.strptime(
                      value,
                      "%b %d, %Y, %I:%M %p"
                  )

                  return parsed.strftime("%Y-%m-%d")

              except ValueError:
                  return ""

          def discover_campaigns(page):
              page.goto(
                  LIST_URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.get_by_text(
                  "Rows per page:",
                  exact=False
              ).first.wait_for(timeout=30000)

              page.wait_for_timeout(2000)

              body = page.locator("body").inner_text()

              # AiSensy's visible campaign list contains:
              # Campaign
              # Type
              # Created At
              # Status
              # Audience
              # campaign-name
              # BROADCAST
              # date
              # Sent
              # audience

              pattern = re.compile(
                  r"(?m)^([^\n]+)\n"
                  r"BROADCAST\n\n?"
                  r"([A-Za-z]{3} \d{1,2}, \d{4}, "
                  r"\d{1,2}:\d{2} [AP]M)"
              )

              names = []

              for match in pattern.finditer(body):
                  name = match.group(1).strip()

                  if name and name not in names:
                      names.append(name)

              print(
                  f"Discovered {len(names)} broadcast names"
              )

              for name in names[:MAX_CAMPAIGNS]:
                  print("Campaign:", name)

              if not names:
                  raise RuntimeError(
                      "Could not identify campaign names "
                      "from AiSensy list"
                  )

              return names[:MAX_CAMPAIGNS]

          def open_campaign(page, name):
              page.goto(
                  LIST_URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.get_by_text(
                  "Rows per page:",
                  exact=False
              ).first.wait_for(timeout=30000)

              # Campaign names are clickable even though
              # AiSensy does not use normal table rows.
              campaign = page.get_by_text(
                  name,
                  exact=True
              ).first

              campaign.wait_for(timeout=15000)
              campaign.click(timeout=15000)

              page.wait_for_url(
                  re.compile(r"/campaigns/all/view/[^/]+"),
                  timeout=20000
              )

              return page.url

          def extract_campaign(page, url, name):
              page.goto(
                  url,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.get_by_text(
                  "Total Credit Usage",
                  exact=True
              ).first.wait_for(timeout=30000)

              page.wait_for_timeout(1500)

              text = page.locator("body").inner_text()

              lines = [
                  line.strip()
                  for line in text.splitlines()
                  if line.strip()
              ]

              campaign_type = field_after(
                  lines,
                  "Campaign Type"
              ).upper()

              if campaign_type != "BROADCAST":
                  return None

              audience = metric(lines, "Audience")
              sent = metric(lines, "Sent")
              delivered = metric(lines, "Delivered")
              read = metric(lines, "Read")
              failed = actual_failed(text)
              cost = actual_cost(lines)

              if not (
                  audience >= sent >= delivered >= 0
              ):
                  raise ValueError("Invalid message counts")

              if not 0 <= read <= delivered:
                  raise ValueError("Invalid read count")

              if not 0 <= failed <= audience:
                  raise ValueError("Invalid failed count")

              if cost < 0:
                  raise ValueError("Invalid credit usage")

              return {
                  "id": url.rstrip("/").split("/")[-1],
                  "name": name,
                  "date": campaign_date(lines),
                  "type": campaign_type,
                  "audience": audience,
                  "sent": sent,
                  "delivered": delivered,
                  "read": read,
                  "failed": failed,
                  "cost": cost,
              }

          state = json.loads(
              os.environ["AISENSY_SESSION"]
          )

          campaigns = []

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  storage_state=state
              )

              page = context.new_page()

              names = discover_campaigns(page)

              for name in names:
                  try:
                      print(f"Opening campaign: {name}")

                      url = open_campaign(page, name)

                      print("Opened campaign detail page")

                      data = extract_campaign(
                          page,
                          url,
                          name
                      )

                      if data:
                          campaigns.append(data)

                          print(
                              f"Extracted {name}: "
                              f"sent={data['sent']}, "
                              f"delivered={data['delivered']}, "
                              f"read={data['read']}, "
                              f"failed={data['failed']}, "
                              f"cost=INR {data['cost']}"
                          )

                  except Exception as error:
                      print(
                          f"Skipped {name}: {error}"
                      )

              browser.close()

          if not campaigns:
              raise RuntimeError(
                  "No campaign analytics extracted. "
                  "Google Sheets was not modified."
              )

          credentials = (
              service_account.Credentials
              .from_service_account_info(
                  json.loads(
                      os.environ[
                          "GOOGLE_SERVICE_ACCOUNT_JSON"
                      ]
                  ),
                  scopes=[
                      "https://www.googleapis.com/auth/spreadsheets"
                  ]
              )
          )

          service = build(
              "sheets",
              "v4",
              credentials=credentials,
              cache_discovery=False
          )

          spreadsheet_id = os.environ[
              "GOOGLE_SHEET_ID"
          ]

          sheets = service.spreadsheets()

          response = sheets.values().get(
              spreadsheetId=spreadsheet_id,
              range=f"'{SHEET}'!A2:A"
          ).execute()

          existing = response.get("values", [])

          existing_ids = {}

          for index, row in enumerate(existing, start=2):
              if row and row[0]:
                  existing_ids[row[0]] = index

          next_row = len(existing) + 2

          updates = []

          now = datetime.now(
              timezone.utc
          ).isoformat()

          for campaign in campaigns:
              campaign_id = campaign["id"]

              if campaign_id in existing_ids:
                  row = existing_ids[campaign_id]
                  action = "UPDATE"

              else:
                  row = next_row
                  next_row += 1
                  existing_ids[campaign_id] = row
                  action = "INSERT"

              updates.extend([
                  {
                      "range": f"'{SHEET}'!A{row}:I{row}",
                      "values": [[
                          campaign["id"],
                          campaign["name"],
                          campaign["date"],
                          campaign["type"],
                          campaign["audience"],
                          campaign["sent"],
                          campaign["delivered"],
                          campaign["read"],
                          campaign["failed"]
                      ]]
                  },
                  {
                      "range": f"'{SHEET}'!J{row}:K{row}",
                      "values": [[
                          f"=IFERROR(G{row}/F{row},0)",
                          f"=IFERROR(H{row}/G{row},0)"
                      ]]
                  },
                  {
                      "range": f"'{SHEET}'!M{row}:O{row}",
                      "values": [[
                          (
                              f'=IF(OR(G{row}="",'
                              f'L{row}=""),"",'
                              f'G{row}*L{row})'
                          ),
                          campaign["cost"],
                          now
                      ]]
                  }
              ])

              print(
                  f"{action}: {campaign['name']} "
                  f"-> row {row}"
              )

          sheets.values().batchUpdate(
              spreadsheetId=spreadsheet_id,
              body={
                  "valueInputOption": "USER_ENTERED",
                  "data": updates
              }
          ).execute()

          print(
              f"SUCCESS: Updated "
              f"{len(campaigns)} broadcasts "
              f"in Google Sheets"
          )
          PY
