name: Test AiSensy Login

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test AiSensy Login
        env:
          AISENSY_EMAIL: ${{ secrets.AISENSY_EMAIL }}
          AISENSY_PASSWORD: ${{ secrets.AISENSY_PASSWORD }}

        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          username = os.environ.get("AISENSY_EMAIL", "")
          password = os.environ.get("AISENSY_PASSWORD", "")

          if not username or not password:
              raise RuntimeError(
                  "Missing GitHub Secrets. "
                  "Add AISENSY_EMAIL and AISENSY_PASSWORD "
                  "under Settings > Secrets and variables > Actions."
              )

          dashboard_url = (
              "https://www.app.aisensy.com/projects/"
              "6589906ef69fc70b424e0e43/dashboard"
          )

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              try:
                  print("Opening AiSensy login page...")

                  page.goto(
                      "https://www.app.aisensy.com/login",
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  username_field = page.locator(
                      'input[type="text"], input[type="email"]'
                  ).first

                  password_field = page.locator(
                      'input[type="password"]'
                  )

                  username_field.fill(username)
                  password_field.fill(password)

                  password_field.press("Tab")

                  page.wait_for_timeout(2000)

                  continue_button = page.get_by_text(
                      "Continue",
                      exact=True
                  )

                  button_enabled = continue_button.is_enabled()

                  print("Continue button enabled:", button_enabled)

                  if not button_enabled:
                      print(
                          "Username field valid:",
                          username_field.evaluate(
                              "(el) => el.checkValidity()"
                          )
                      )

                      print(
                          "Password field valid:",
                          password_field.evaluate(
                              "(el) => el.checkValidity()"
                          )
                      )

                      raise RuntimeError(
                          "Continue button disabled. "
                          "Check login identifier format and validation."
                      )

                  print("Submitting login...")

                  continue_button.click(timeout=10000)

                  page.wait_for_timeout(6000)

                  print("Checking authentication status...")

                  # Do not print the full URL because
                  # authentication redirects may contain tokens.
                  print(
                      "Still on login page:",
                      "/login" in page.url
                  )

                  print("Checking dashboard access...")

                  page.goto(
                      dashboard_url,
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  page.wait_for_timeout(5000)

                  if "/login" in page.url:
                      raise RuntimeError(
                          "Dashboard authentication not confirmed. "
                          "Login may require OTP or other verification."
                      )

                  if "/dashboard" not in page.url:
                      raise RuntimeError(
                          "Unexpected navigation after login. "
                          "Dashboard access not confirmed."
                      )

                  print(
                      "SUCCESS: AiSensy dashboard navigation completed!"
                  )

              finally:
                  browser.close()
          PY
