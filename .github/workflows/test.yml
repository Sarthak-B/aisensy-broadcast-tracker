name: Test AiSensy Login

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test AiSensy Login
        env:
          AISENSY_EMAIL: ${{ secrets.AISENSY_EMAIL }}
          AISENSY_PASSWORD: ${{ secrets.AISENSY_PASSWORD }}

        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          username = os.environ.get("AISENSY_EMAIL", "")
          password = os.environ.get("AISENSY_PASSWORD", "")

          if not username or not password:
              raise RuntimeError(
                  "Missing GitHub Secrets. "
                  "Check AISENSY_EMAIL and AISENSY_PASSWORD."
              )

          dashboard_url = (
              "https://www.app.aisensy.com/projects/"
              "6589906ef69fc70b424e0e43/dashboard"
          )

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              try:
                  print("Opening AiSensy login...")

                  page.goto(
                      "https://www.app.aisensy.com/login",
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  page.locator(
                      'input[type="text"], input[type="email"]'
                  ).first.fill(username)

                  page.locator(
                      'input[type="password"]'
                  ).fill(password)

                  # Trigger normal field validation
                  page.locator(
                      'input[type="password"]'
                  ).press("Tab")

                  page.wait_for_timeout(2000)

                  continue_button = page.get_by_text(
                      "Continue",
                      exact=True
                  )

                  print(
                      "Continue button enabled:",
                      continue_button.is_enabled()
                  )

                  if not continue_button.is_enabled():
                      print(
                          "Login form is not ready to submit."
                      )
                      print(
                          "Username field valid:",
                          page.locator(
                              'input[type="text"], input[type="email"]'
                          ).first.evaluate(
                              "(el) => el.checkValidity()"
                          )
                      )
                      print(
                          "Password field valid:",
                          page.locator(
                              'input[type="password"]'
                          ).evaluate(
                              "(el) => el.checkValidity()"
                          )
                      )
                      raise RuntimeError(
                          "Continue button disabled. "
                          "Check username format or form validation."
                      )

                  print("Submitting login...")

                  continue_button.click(timeout=10000)

                  page.wait_for_timeout(5000)

                  if "/login" in page.url:
                      print(
                          "Still on login page. "
                          "Additional verification may be required."
                      )
                  else:
                      print(
                          "Login navigation occurred."
                      )

                  print("Checking dashboard access...")

                  page.goto(
                      dashboard_url,
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  page.wait_for_timeout(5000)

                  if "/login" in page.url:
                      print(
                          "Dashboard access not confirmed."
                      )
                  else:
                      print(
                          "SUCCESS: Dashboard navigation completed."
                      )

              finally:
                  browser.close()
          PY
