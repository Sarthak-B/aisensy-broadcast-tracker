name: Export AiSensy Broadcast Analytics

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright google-auth google-api-python-client
          python -m playwright install --with-deps chromium

      - name: Discover campaigns and update Google Sheets
        env:
          AISENSY_SESSION: ${{ secrets.AISENSY_SESSION }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from urllib.parse import urljoin

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from playwright.sync_api import sync_playwright

          PROJECT_ID = "6589906ef69fc70b424e0e43"

          BASE = (
              "https://www.app.aisensy.com/projects/"
              + PROJECT_ID
          )

          LIST_URL = BASE + "/campaigns/all"

          SHEET = "Broadcast_Data"

          MAX_CAMPAIGNS = 10

          def number(lines, label):
              matches = []

              for i, line in enumerate(lines[:-1]):
                  if line.lower() == label.lower():
                      value = lines[i + 1]

                      if re.fullmatch(r"[\d,]+", value):
                          matches.append(
                              int(value.replace(",", ""))
                          )

              if not matches:
                  raise ValueError(
                      f"Missing metric: {label}"
                  )

              return matches[-1]

          def actual_cost(lines):
              matches = []

              for i, line in enumerate(lines[:-1]):
                  if line == "Total Credit Usage":
                      match = re.fullmatch(
                          r"₹\s*([\d,]+(?:\.\d+)?)",
                          lines[i + 1]
                      )

                      if match:
                          matches.append(
                              float(
                                  match.group(1).replace(",", "")
                              )
                          )

              if not matches:
                  raise ValueError(
                      "Missing Total Credit Usage"
                  )

              return matches[-1]

          def actual_failed(text):
              patterns = [
                  r"\(\s*([\d,]+)\s*\)\s*Failed\b",
                  r"\bFailed\s*\(\s*([\d,]+)\s*\)",
                  r"\bFailed\s*\n\s*([\d,]+)\s*(?:\n|$)",
              ]

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      text,
                      re.IGNORECASE
                  )

                  if match:
                      return int(
                          match.group(1).replace(",", "")
                      )

              raise ValueError(
                  "Could not read actual Failed count"
              )

          def field_after(lines, label):
              for i, line in enumerate(lines[:-1]):
                  if line.lower() == label.lower():
                      return lines[i + 1]

              return ""

          def campaign_date(lines):
              created = field_after(lines, "Created At")

              if not created:
                  return ""

              try:
                  parsed = datetime.strptime(
                      created,
                      "%b %d, %Y, %I:%M %p"
                  )

                  return parsed.strftime("%Y-%m-%d")

              except ValueError:
                  return ""

          def get_campaign(page, url):
              page.goto(
                  url,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.get_by_text(
                  "Total Credit Usage",
                  exact=True
              ).first.wait_for(timeout=30000)

              page.wait_for_timeout(2000)

              text = page.locator("body").inner_text()

              lines = [
                  line.strip()
                  for line in text.splitlines()
                  if line.strip()
              ]

              campaign_type = field_after(
                  lines, "Campaign Type"
              ).upper()

              if campaign_type != "BROADCAST":
                  return None

              campaign_id = url.rstrip("/").split("/")[-1]

              audience = number(lines, "Audience")
              sent = number(lines, "Sent")
              delivered = number(lines, "Delivered")
              read = number(lines, "Read")
              failed = actual_failed(text)
              cost = actual_cost(lines)

              if not (
                  audience >= sent >= delivered >= 0
              ):
                  raise ValueError(
                      "Invalid campaign statistics"
                  )

              if not 0 <= read <= delivered:
                  raise ValueError(
                      "Invalid read count"
                  )

              if failed > audience:
                  raise ValueError(
                      "Invalid failed count"
                  )

              if cost < 0:
                  raise ValueError(
                      "Invalid credit usage"
                  )

              campaign_name = lines[0]

              return {
                  "id": campaign_id,
                  "name": campaign_name,
                  "date": campaign_date(lines),
                  "type": campaign_type,
                  "audience": audience,
                  "sent": sent,
                  "delivered": delivered,
                  "read": read,
                  "failed": failed,
                  "cost": cost,
              }

          # UPDATED CAMPAIGN DISCOVERY FUNCTION
          # This version collects diagnostics instead
          # of attempting to update Google Sheets.

          def discover_campaign_urls(page):
              page.goto(
                  LIST_URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(5000)

              if "/login" in page.url:
                  raise RuntimeError(
                      "AiSensy session has expired"
                  )

              print("\n--- CAMPAIGN LIST DIAGNOSTICS ---")
              print("Current URL:", page.url)

              print(
                  "Table rows:",
                  page.locator("tbody tr").count()
              )

              print(
                  "Role rows:",
                  page.locator("[role='row']").count()
              )

              print(
                  "Links:",
                  page.locator("a").count()
              )

              print(
                  "Buttons:",
                  page.locator("button").count()
              )

              preview = page.locator("body").inner_text()

              print("\n--- CAMPAIGN LIST PREVIEW ---")
              print(preview[:2000])
              print("--- END PREVIEW ---")

              raise RuntimeError(
                  "Diagnostic run complete. "
                  "Review campaign-list structure."
              )

          # Connect to Google Sheets.

          credentials = (
              service_account.Credentials
              .from_service_account_info(
                  json.loads(
                      os.environ[
                          "GOOGLE_SERVICE_ACCOUNT_JSON"
                      ]
                  ),
                  scopes=[
                      "https://www.googleapis.com/auth/spreadsheets"
                  ]
              )
          )

          service = build(
              "sheets",
              "v4",
              credentials=credentials,
              cache_discovery=False
          )

          spreadsheet_id = os.environ[
              "GOOGLE_SHEET_ID"
          ]

          sheets = service.spreadsheets()

          response = sheets.values().get(
              spreadsheetId=spreadsheet_id,
              range=f"'{SHEET}'!A2:A"
          ).execute()

          existing = response.get("values", [])

          existing_ids = {}

          for index, row in enumerate(existing, start=2):
              if row and row[0]:
                  existing_ids[row[0]] = index

          next_row = len(existing) + 2

          state = json.loads(
              os.environ["AISENSY_SESSION"]
          )

          campaigns = []

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  storage_state=state
              )

              page = context.new_page()

              print("Discovering recent campaigns...")

              # This function intentionally stops
              # after printing diagnostics.
              urls = discover_campaign_urls(page)

              print(
                  f"Found {len(urls)} campaign URLs"
              )

              for url in urls:
                  try:
                      campaign = get_campaign(
                          page, url
                      )

                      if campaign is None:
                          print(
                              "Skipped non-broadcast campaign"
                          )
                          continue

                      campaigns.append(campaign)

                      print(
                          "Extracted:",
                          campaign["id"],
                          "sent=",
                          campaign["sent"],
                          "cost=INR",
                          campaign["cost"]
                      )

                  except Exception as error:
                      print(
                          "Skipped campaign:",
                          url.split("/")[-1],
                          str(error)
                      )

              browser.close()

          if not campaigns:
              raise RuntimeError(
                  "No valid broadcast campaigns extracted. "
                  "Google Sheets was not changed."
              )

          updates = []

          now = datetime.now(
              timezone.utc
          ).isoformat()

          for campaign in campaigns:
              campaign_id = campaign["id"]

              if campaign_id in existing_ids:
                  row = existing_ids[campaign_id]
                  action = "UPDATE"

              else:
                  row = next_row
                  next_row += 1

                  existing_ids[campaign_id] = row
                  action = "INSERT"

              updates.extend([
                  {
                      "range": (
                          f"'{SHEET}'!A{row}:I{row}"
                      ),
                      "values": [[
                          campaign["id"],
                          campaign["name"],
                          campaign["date"],
                          campaign["type"],
                          campaign["audience"],
                          campaign["sent"],
                          campaign["delivered"],
                          campaign["read"],
                          campaign["failed"]
                      ]]
                  },
                  {
                      "range": (
                          f"'{SHEET}'!J{row}:K{row}"
                      ),
                      "values": [[
                          f"=IFERROR(G{row}/F{row},0)",
                          f"=IFERROR(H{row}/G{row},0)"
                      ]]
                  },
                  {
                      "range": (
                          f"'{SHEET}'!M{row}:O{row}"
                      ),
                      "values": [[
                          (
                              f'=IF(OR(G{row}="",'
                              f'L{row}=""),"",'
                              f'G{row}*L{row})'
                          ),
                          campaign["cost"],
                          now
                      ]]
                  }
              ])

              print(
                  f"{action}: {campaign_id} "
                  f"-> row {row}"
              )

          sheets.values().batchUpdate(
              spreadsheetId=spreadsheet_id,
              body={
                  "valueInputOption": "USER_ENTERED",
                  "data": updates
              }
          ).execute()

          print(
              f"SUCCESS: Updated "
              f"{len(campaigns)} broadcasts "
              f"in Google Sheets"
          )
          PY
