                      'spec': {'title': title, 'basicChart': {
                          'chartType': 'COLUMN', 'legendPosition': 'BOTTOM_LEGEND', 'headerCount': 1,
                          'axis': [{'position': 'BOTTOM_AXIS', 'title': 'Webinar (inferred)'},
                                   {'position': 'LEFT_AXIS', 'title': 'Read rate' if len(columns) == 1 else 'Messages'}],
                          'domains': [{'domain': {'sourceRange': {'sources': [chart_range(0, 1)]}}}],
                          'series': [{'series': {'sourceRange': {'sources': [chart_range(a, b)]}}, 'targetAxis': 'LEFT_AXIS'} for a, b in columns],
                      }},
                      'position': {'overlayPosition': {'anchorCell': {'sheetId': webinar_ws.id, 'rowIndex': row_anchor, 'columnIndex': 11},
                                                       'widthPixels': 650, 'heightPixels': 350}},
                  }}})
          chart_requests += [
              {'updateDimensionProperties': {'range': {'sheetId': webinar_ws.id, 'dimension': 'COLUMNS', 'startIndex': 0, 'endIndex': 1}, 'properties': {'pixelSize': 310}, 'fields': 'pixelSize'}},
              {'updateDimensionProperties': {'range': {'sheetId': webinar_ws.id, 'dimension': 'COLUMNS', 'startIndex': 1, 'endIndex': 10}, 'properties': {'pixelSize': 140}, 'fields': 'pixelSize'}},
          ]
          spreadsheet.batch_update({'requests': chart_requests})

          if contents_ws is None:
              contents_ws = spreadsheet.add_worksheet(title='Broadcast Contents', rows=max(100, len(records)+1), cols=8)
          content_headers = ['Campaign ID', 'Campaign Name', 'Date and Time (IST)', 'Message Content',
                             'Content Status', 'Content Source', 'Content Updated (IST)', 'Metrics Updated (IST)']
          content_rows = []
          fetched_by_id = {rec['Campaign ID']: rec for rec in fetched}
          for rec in records:
              cid = rec['Campaign ID']
              previous = contents_by_id.get(cid, {})
              fresh = fetched_by_id.get(cid, {})
              text = fresh.get('Message Content') or previous.get('Message Content', '')
              status = fresh.get('Content Status') if fresh.get('Message Content') else previous.get('Content Status', 'Content unavailable')
              source = fresh.get('Content Source') if fresh.get('Message Content') else previous.get('Content Source', '')
              content_time = fresh.get('Last Updated') if fresh.get('Message Content') else previous.get('Content Updated (IST)', '')
              # Google Sheets cells are limited to 50,000 characters. Never truncate silently.
              if len(str(text)) > 50000:
                  raise RuntimeError(f'Content exceeds the Google Sheets cell limit for {cid}; previous content tab retained.')
              content_rows.append([cid, rec['Campaign Name'], date_with_time(rec), text, status, source, content_time, rec['Last Updated']])
          ensure_rows(contents_ws, len(content_rows)+1)
          if contents_ws.col_count < 8:
              contents_ws.add_cols(8 - contents_ws.col_count)
          contents_ws.clear()
          update_values(contents_ws, f'A1:H{len(content_rows)+1}', [content_headers] + content_rows)
          contents_ws.freeze(rows=1)
          contents_ws.format(f'D2:D{len(content_rows)+1}', {'wrapStrategy': 'WRAP', 'verticalAlignment': 'TOP'})
          spreadsheet.batch_update({'requests': [
              {'updateDimensionProperties': {'range': {'sheetId': contents_ws.id, 'dimension': 'COLUMNS', 'startIndex': 3, 'endIndex': 4}, 'properties': {'pixelSize': 650}, 'fields': 'pixelSize'}},
              {'updateDimensionProperties': {'range': {'sheetId': contents_ws.id, 'dimension': 'COLUMNS', 'startIndex': 1, 'endIndex': 3}, 'properties': {'pixelSize': 260}, 'fields': 'pixelSize'}},
              {'autoResizeDimensions': {'dimensions': {'sheetId': contents_ws.id, 'dimension': 'ROWS', 'startIndex': 1, 'endIndex': len(content_rows)+1}}},
          ]})

          # Retain Broadcast Analysis and the new Webinar Dashboard.
          for title in ('Message Tests', 'Dashboard Settings'):
              ws = sheets_by_title.get(title)
              if ws is not None:
                  spreadsheet.del_worksheet(ws)
          if schedule_ws is not None:
              spreadsheet.del_worksheet(schedule_ws)

          print(f'Sync complete: {new_count} new, {updated_count} updated, {len(records)} total campaigns.', flush=True)
          PY

      - name: Record failed sync in Dashboard
