          webinar_ws.format('B11:B12', {'numberFormat': {'type': 'PERCENT', 'pattern': '0.00%'}})
          webinar_ws.format('B10', {'numberFormat': {'type': 'NUMBER', 'pattern': '#,##0.00'}})
          webinar_ws.format('B13', {'numberFormat': {'type': 'NUMBER', 'pattern': '#,##0.00'}})
          if groups:
              webinar_ws.format(f'H18:I{17+len(groups)}', {'numberFormat': {'type': 'PERCENT', 'pattern': '0.00%'}})
              for col in ('G', 'J'):
                  webinar_ws.format(f'{col}18:{col}{17+len(groups)}', {'numberFormat': {'type': 'NUMBER', 'pattern': '#,##0.00'}})
          if message_groups:
              start = message_heading + 2
              webinar_ws.format(f'F{start}:F{start+len(message_groups)-1}', {'numberFormat': {'type': 'PERCENT', 'pattern': '0.00%'}})
          if eligible:
              start = top_heading + 2
              webinar_ws.format(f'F{start}:F{start+len(eligible)-1}', {'numberFormat': {'type': 'PERCENT', 'pattern': '0.00%'}})

          # Replace dashboard charts, preventing duplicate charts on every run.
          chart_requests = []
          metadata = spreadsheet.fetch_sheet_metadata()
          for sheet in metadata.get('sheets', []):
              if sheet.get('properties', {}).get('sheetId') == webinar_ws.id:
                  for chart in sheet.get('charts', []):
                      chart_requests.append({'deleteEmbeddedObject': {'objectId': chart['chartId']}})
          def chart_range(start_col, end_col):
