name: Test AiSensy Saved Session

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test AiSensy Session
        env:
          AISENSY_SESSION: ${{ secrets.AISENSY_SESSION }}
        run: |
          python - <<'PY'
          import json
          import os
          from playwright.sync_api import sync_playwright

          session = os.environ.get("AISENSY_SESSION")

          if not session:
              raise RuntimeError("AISENSY_SESSION secret is missing.")

          state = json.loads(session)

          dashboard = (
              "https://www.app.aisensy.com/projects/"
              "6589906ef69fc70b424e0e43/dashboard"
          )

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(storage_state=state)
              page = context.new_page()

              page.goto(
                  dashboard,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(10000)

              if "/login" in page.url:
                  raise RuntimeError(
                      "Saved session rejected. AiSensy requires login."
                  )

              if page.locator('input[type="password"]').count() > 0:
                  raise RuntimeError(
                      "Login form is visible. Session not authenticated."
                  )

              if "/dashboard" not in page.url:
                  raise RuntimeError(
                      "Dashboard URL not reached."
                  )

              print("SUCCESS: GitHub reached AiSensy dashboard URL.")
              print("Authenticated dashboard data still needs verification.")

              browser.close()
          PY
