name: Test AiSensy Login

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test AiSensy Login
        env:
          AISENSY_EMAIL: ${{ secrets.AISENSY_EMAIL }}
          AISENSY_PASSWORD: ${{ secrets.AISENSY_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          username = os.environ["AISENSY_EMAIL"]
          password = os.environ["AISENSY_PASSWORD"]

          dashboard_url = (
              "https://www.app.aisensy.com/projects/"
              "6589906ef69fc70b424e0e43/dashboard"
          )

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              try:
                  print("Opening AiSensy login page...")

                  page.goto(
                      "https://www.app.aisensy.com/login",
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  page.locator(
                      'input[type="text"], input[type="email"]'
                  ).first.fill(username)

                  page.locator(
                      'input[type="password"]'
                  ).fill(password)

                  page.get_by_text(
                      "Continue",
                      exact=True
                  ).click()

                  page.wait_for_timeout(8000)

                  print("Checking login status...")

                  page.goto(
                      dashboard_url,
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  page.wait_for_timeout(5000)

                  if "/login" in page.url:
                      raise RuntimeError(
                          "Login unsuccessful or additional verification required."
                      )

                  print("SUCCESS: AiSensy dashboard reached!")
                  print("Page title:", page.title())

              finally:
                  browser.close()
          PY
