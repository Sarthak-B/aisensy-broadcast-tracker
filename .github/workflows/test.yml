name: Sync AiSensy Broadcasts to Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'  # Every 2 hours, offset from GitHub's busy minute 0

permissions:
  contents: read

concurrency:
  group: aisensy-google-sheets-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright gspread google-auth
          python -m playwright install --with-deps chromium

      - name: Refresh latest broadcasts and rotating historical batch
        env:
          AISENSY_SESSION: ${{ secrets.AISENSY_SESSION }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from contextlib import contextmanager
          from datetime import timedelta
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright
          import gspread
          from google.oauth2.service_account import Credentials

          PROJECT_ID = '6589906ef69fc70b424e0e43'
          LIST_URL = f'https://www.app.aisensy.com/projects/{PROJECT_ID}/campaigns/all'
          MAX_CAMPAIGNS = 5
          HISTORICAL_BATCH_SIZE = 5
          SHEET_ID = os.environ.get('GOOGLE_SHEET_ID', '').strip() or '1jXnQPQngi-FbEBBHC0tvaOTXxmtE5_miv6Mq0rTbmLQ'
          IST = ZoneInfo('Asia/Kolkata')

          def ist_now():
              return datetime.now(IST).strftime('%Y-%m-%d %I:%M:%S %p IST')

          def existing_time_to_ist(value):
              value = str(value or '').strip()
              if not value:
                  return value
              if value.endswith(' IST'):
                  return value
              try:
                  parsed = datetime.fromisoformat(value.replace('Z', '+00:00'))
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)
                  return parsed.astimezone(IST).strftime('%Y-%m-%d %I:%M:%S %p IST')
              except ValueError:
                  return value

          HEADERS = ['Campaign ID', 'Campaign Name', 'Date', 'Campaign Type', 'Audience Size', 'Sent', 'Delivered', 'Read', 'Failed', 'Delivery Rate', 'Read Rate', 'Cost per Message', 'Estimated Cost', 'Actual Cost', 'Last Updated']

          def number(value, default=0.0):
              try:
                  return float(re.sub(r'[^0-9.\-]', '', str(value)))
              except (TypeError, ValueError):
                  return default

          def count(value):
              return int(number(value))

          def metric(body, label):
              match = re.search(rf'(?im)^\s*{re.escape(label)}\s*\n\s*([\d,]+)\s*$', body)
              return count(match.group(1)) if match else None

          def money(body):
              match = re.search(r'(?im)^\s*Total Credit Usage\s*\n\s*₹\s*([\d,]+(?:\.\d+)?)', body)
              return number(match.group(1)) if match else None

          def failed_count(body):
              direct = metric(body, 'Failed')
              if direct is not None:
                  return direct
              match = re.search(r'(?i)[\d.]+\s*%\s*\(\s*([\d,]+)\s*\)\s*Failed\b', body)
              if match:
                  return count(match.group(1))
              return None

          def date_from_body(body):
              match = re.search(r'(?i)Created At\s*\n\s*([A-Za-z]{3}\s+\d{1,2},\s+\d{4})', body)
              if not match:
                  return ''
              try:
                  return datetime.strptime(match.group(1), '%b %d, %Y').strftime('%Y-%m-%d')
              except ValueError:
                  return ''

          def sent_time_from_body(body):
              # Only explicit actual-sent labels qualify. Never use creation,
              # scheduled, updated, completion, or first-observed timestamps.
              label = re.compile(r'^(?:Broadcast Sent At|Campaign Sent At|Sent At|Sent On)\s*(?::\s*(.*))?$', re.I)
              lines = [line.strip() for line in body.splitlines() if line.strip()]
              for index, line in enumerate(lines):
                  match = label.fullmatch(line)
                  if not match:
                      continue
                  value = (match.group(1) or '').strip()
                  if not value and index + 1 < len(lines):
                      value = lines[index + 1]
                  # Require a clock time and an explicit timezone. A timezone-free
                  # UI value cannot safely be assumed to be IST or UTC.
                  if not re.search(r'\d{1,2}:\d{2}', value):
                      continue
                  tz_match = re.search(r'\s*(IST|UTC|GMT|Z|[+-]\d{2}:?\d{2})$', value, re.I)
                  if not tz_match:
                      continue
                  zone = tz_match.group(1).upper()
                  stamp = value[:tz_match.start()].strip().rstrip(',').strip()
                  if zone == 'IST':
                      tz = IST
                  elif zone in ('UTC', 'GMT', 'Z'):
                      tz = timezone.utc
                  else:
                      try:
                          offset = zone if ':' in zone else zone[:3] + ':' + zone[3:]
                          tz = datetime.fromisoformat('2000-01-01T00:00:00' + offset).tzinfo
                      except ValueError:
                          continue
                  parsed = None
                  try:
                      parsed = datetime.fromisoformat(stamp)
                  except ValueError:
                      for fmt in (
                          '%b %d, %Y %I:%M:%S %p', '%b %d, %Y %I:%M %p',
                          '%B %d, %Y %I:%M:%S %p', '%B %d, %Y %I:%M %p',
                          '%b %d, %Y, %I:%M:%S %p', '%b %d, %Y, %I:%M %p',
                          '%b %d, %Y %H:%M:%S', '%b %d, %Y %H:%M',
                          '%Y-%m-%d %I:%M:%S %p', '%Y-%m-%d %I:%M %p',
                      ):
                          try:
                              parsed = datetime.strptime(stamp, fmt)
                              break
                          except ValueError:
                              pass
                  if parsed is not None:
                      return parsed.replace(tzinfo=tz).astimezone(IST).strftime('%Y-%m-%d %I:%M:%S %p IST')
              return ''

          def actual_sent_value(value):
              # Numeric API timestamps are Unix seconds or milliseconds.
              if isinstance(value, bool) or value is None:
                  return ''
              if isinstance(value, (int, float)) or re.fullmatch(r'\d{10}(?:\.\d+)?|\d{13}', str(value).strip()):
                  try:
                      seconds = float(value)
                      if seconds >= 1e12:
                          seconds /= 1000
                      parsed = datetime.fromtimestamp(seconds, timezone.utc)
                      if 2000 <= parsed.year <= 2100:
                          return parsed.astimezone(IST).strftime('%Y-%m-%d %I:%M:%S %p IST')
                  except (ValueError, OverflowError, OSError):
                      pass
                  return ''
              return sent_time_from_body('Sent At: ' + str(value))

          @contextmanager
          def campaign_responses(page):
              payloads = []
              def capture(response):
                  # Read existing browser responses; no guessed API calls.
                  if len(payloads) >= 100:
                      return
                  if not re.match(r'https://(?:[A-Za-z0-9-]+\.)*aisensy\.com/', response.url, re.I):
                      return
                  if not re.search(r'campaign|broadcast', response.url, re.I):
                      return
                  if response.request.resource_type not in ('xhr', 'fetch'):
                      return
                  try:
                      if response.ok and 'json' in response.headers.get('content-type', '').lower():
                          payload = response.json()
                          if isinstance(payload, (dict, list)):
                              payloads.append(payload)
                  except Exception:
                      pass  # Optional timestamp lookup cannot break metrics.
              page.on('response', capture)
              try:
                  yield payloads
              finally:
                  page.remove_listener('response', capture)

          def sent_time_from_responses(payloads, campaign_id):
              allowed = {
                  'sentat', 'senton', 'senttime', 'senttimestamp', 'sentdatetime',
                  'broadcastsentat', 'broadcastsenttime', 'campaignsentat',
                  'actualsentat', 'actualsenttime', 'actualsenttimestamp',
              }
              id_keys = {'id', 'campaignid', 'broadcastid'}
              found = set()
              observed_keys = set()
              def normalized(key):
                  return re.sub(r'[^a-z0-9]', '', str(key).lower())
              def walk(value):
                  if isinstance(value, list):
                      for item in value:
                          walk(item)
                  elif isinstance(value, dict):
                      ids = [str(v) for k, v in value.items() if normalized(k) in id_keys and not isinstance(v, (dict, list))]
                      # Require a matching campaign object, never a recipient/message.
                      if campaign_id in ids and not any(normalized(k) in {'messageid', 'contactid', 'recipientid', 'phone', 'phonenumber'} for k in value):
                          observed_keys.update(str(k) for k in value if re.search(r'at$|time|date|sent', str(k), re.I))
                          for key, item in value.items():
                              if normalized(key) in allowed:
                                  timestamp = actual_sent_value(item)
                                  if timestamp:
                                      found.add(timestamp)
                      for item in value.values():
                          if isinstance(item, (dict, list)):
                              walk(item)
              for payload in payloads:
                  walk(payload)
              if len(found) == 1:
                  return next(iter(found))
              if len(found) > 1:
                  print(f'Conflicting explicit sent timestamps for {campaign_id}; retaining historical value.', flush=True)
              elif observed_keys:
                  print(f'No usable actual-sent field for {campaign_id}; timestamp field names: {sorted(observed_keys)}', flush=True)
              return ''

          def resolve_sent_time(body, payloads, campaign_id):
              return sent_time_from_responses(payloads, campaign_id) or sent_time_from_body(body)

          def source_time(value):
              # Preserve the existing Broadcast Analysis values as requested.
              # These values are not evidence of actual sending by themselves.
              if isinstance(value, (int, float)) and not isinstance(value, bool):
                  if 36526 <= value < 73416:
                      local = datetime(1899, 12, 30) + timedelta(seconds=round(value * 86400))
                      return local.strftime('%Y-%m-%d %I:%M:%S %p IST')
                  return ''
              return actual_sent_value(value)

          def read_analysis_times(ws):
              rows = ws.get_all_values(value_render_option='UNFORMATTED_VALUE')
              if not rows:
                  return {}
              header = [str(v).strip() for v in rows[0]]
              if 'Campaign ID' not in header or 'Sent At (IST)' not in header:
                  raise RuntimeError('Broadcast Analysis lacks Campaign ID or Sent At (IST); cleanup was not performed.')
              id_col, time_col = header.index('Campaign ID'), header.index('Sent At (IST)')
              result = {}
              for row in rows[1:]:
                  if len(row) <= max(id_col, time_col):
                      continue
                  cid = str(row[id_col]).strip()
                  value = source_time(row[time_col])
                  if cid and value:
                      if cid in result and result[cid] != value:
                          raise RuntimeError(f'Conflicting source times for {cid}; cleanup was not performed.')
                      result[cid] = value
              return result

          def date_with_time(rec):
              return rec.get('Broadcast Sent At (IST)') or rec.get('Date', '')

          def displayed_campaign_time(body):
              match = re.search(r'(?im)^\s*Created At\s*\n\s*([^\n]+)', body)
              if not match:
                  return ''
              value = match.group(1).strip()
              explicit = actual_sent_value(value)
              if explicit:
                  return explicit
              for fmt in ('%b %d, %Y, %I:%M:%S %p', '%b %d, %Y, %I:%M %p',
                          '%b %d, %Y %I:%M:%S %p', '%b %d, %Y %I:%M %p'):
                  try:
                      return datetime.strptime(value, fmt).strftime('%Y-%m-%d %I:%M:%S %p IST')
                  except ValueError:
                      pass
              return ''

          def extract_names(body):
              lines = [line.strip() for line in body.splitlines() if line.strip()]
              names = []
              for index, line in enumerate(lines):
                  if line.upper() != 'BROADCAST' or index == 0:
                      continue
                  candidate = lines[index - 1]
                  if candidate.lower() in ('campaign', 'type', 'broadcast', 'status', 'audience'):
                      continue
                  nearby = ' '.join(lines[index + 1:index + 5])
                  if not re.search(r'[A-Za-z]{3}\s+\d{1,2},\s+\d{4}', nearby):
                      continue
                  if candidate not in names:
                      names.append(candidate)
                  if len(names) >= MAX_CAMPAIGNS:
                      break
              return names

          def wait_for_list(page):
              page.goto(LIST_URL, wait_until='domcontentloaded', timeout=60000)
              page.get_by_text('Rows per page:', exact=False).first.wait_for(timeout=30000)
              page.wait_for_timeout(1400)

          def discover_names(page):
              best = []
              for attempt in range(1, 4):
                  wait_for_list(page)
                  current = extract_names(page.locator('body').inner_text())
                  print(f'Campaign discovery attempt {attempt}: found {len(current)}', flush=True)
                  if len(current) > len(best):
                      best = current
                  if len(best) >= MAX_CAMPAIGNS:
                      break
                  page.wait_for_timeout(1700 * attempt)
              if not best:
                  print('No campaigns detected; no spreadsheet changes will be made.', flush=True)
              elif len(best) < MAX_CAMPAIGNS:
                  print(f'Continuing with {len(best)} available campaign(s), not requiring five.', flush=True)
              return best[:MAX_CAMPAIGNS]

          def content_from_campaign(body, payloads, campaign_id):
              candidates = []
              def clean_key(key):
                  return re.sub(r'[^a-z0-9]', '', str(key).lower())
              def template_text(template):
                  if not isinstance(template, dict):
                      return ''
                  parts = []
                  for component in (template.get('components') or []):
                      if not isinstance(component, dict):
                          continue
                      text = component.get('text')
                      if isinstance(text, str) and text.strip():
                          parameters = (component.get('parameters') or [])
                          for index, parameter in enumerate(parameters, 1):
                              if isinstance(parameter, dict) and isinstance(parameter.get('text'), str):
                                  text = text.replace('{{' + str(index) + '}}', parameter['text'])
                          parts.append(text)
                      for button in (component.get('buttons') or []):
                          if isinstance(button, dict):
                              label = button.get('text', '')
                              url = button.get('url', '')
                              if label or url:
                                  parts.append(str(label) + (' — ' + str(url) if url else ''))
                      for parameter in (component.get('parameters') or []):
                          if isinstance(parameter, dict):
                              for media_type in ('image', 'video', 'document'):
                                  media = parameter.get(media_type)
                                  if isinstance(media, dict) and media.get('link'):
                                      parts.append(media_type.title() + ': ' + str(media['link']))
                  return '\n\n'.join(parts)
              def walk(value):
                  if isinstance(value, list):
                      for item in value:
                          walk(item)
                  elif isinstance(value, dict):
                      ids = [str(v) for k, v in value.items() if clean_key(k) in {'id', 'campaignid', 'broadcastid'} and not isinstance(v, (dict, list))]
                      if campaign_id in ids and not any(clean_key(k) in {'messageid', 'recipientid', 'contactid', 'phone', 'phonenumber'} for k in value):
                          # Read text only from a campaign with the matching ID.
                          for key, item in value.items():
                              normalized = clean_key(key)
                              if normalized in {'renderedmessage', 'messagecontent', 'messagetext', 'broadcastcontent', 'message'} and isinstance(item, str) and item.strip():
                                  candidates.append((0, item.strip(), 'Campaign response'))
                              elif normalized in {'template', 'messagetemplate', 'templatecontent'}:
                                  text = template_text(item)
                                  if text:
                                      candidates.append((1, text, 'Template components'))
                      for item in value.values():
                          if isinstance(item, (dict, list)):
                              walk(item)
              for payload in payloads:
                  walk(payload)
              # Fallback to an explicitly labelled content block, not the whole
              # analytics page. Stop at the next known analytics section.
              lines = body.splitlines()
              for index, line in enumerate(lines):
                  if re.fullmatch(r'\s*(?:Message Content|Broadcast Content|Message Preview|Template Message)\s*:?\s*', line, re.I):
                      parts = []
                      for following in lines[index + 1:]:
                          if re.fullmatch(r'\s*(?:Campaign Type|Campaign Name|Created At|Sent At|Total Credit Usage|Audience|Sent|Delivered|Read|Failed|Analytics|Campaign Details|Message Statistics|Status)\s*:?\s*', following, re.I):
                              break
                          parts.append(following)
                      text = '\n'.join(parts).strip()
                      if text:
                          candidates.append((2, text, 'Labelled message preview'))
              if not candidates:
                  return '', 'Content unavailable', ''
              candidates.sort(key=lambda item: item[0])
              priority = candidates[0][0]
              best = [item for item in candidates if item[0] == priority]
              if len({item[1] for item in best}) != 1:
                  return '', 'Conflicting content; previous value retained', ''
              _, text, source = best[0]
              status = 'Template placeholders remain' if re.search(r'{{.*?}}', text) else 'Captured'
              return text, status, source

          @contextmanager
          def content_responses(page):
              # Content may load from template endpoints, not campaign endpoints.
              # This collector is separate from the unchanged timestamp collector.
              payloads = []
              def capture(response):
                  if len(payloads) >= 150 or response.request.resource_type not in ('xhr', 'fetch'):
                      return
                  if not re.match(r'https://(?:[A-Za-z0-9-]+\.)*aisensy\.com/', response.url, re.I):
                      return
                  try:
                      if response.ok and 'json' in response.headers.get('content-type', '').lower():
                          value = response.json()
                          if isinstance(value, (dict, list)):
                              payloads.append(value)
                  except Exception:
                      pass
              page.on('response', capture)
              try:
                  yield payloads
              finally:
                  page.remove_listener('response', capture)

          def linked_template_content(payloads, campaign_id):
              def key(value):
                  return re.sub(r'[^a-z0-9]', '', str(value).lower())
              objects = []
              def walk(value):
                  if isinstance(value, list):
                      for item in value:
                          walk(item)
                  elif isinstance(value, dict):
                      objects.append(value)
                      for item in value.values():
                          if isinstance(item, (dict, list)):
                              walk(item)
              for payload in payloads:
                  walk(payload)
              campaigns = [obj for obj in objects if campaign_id in [str(v) for k, v in obj.items() if key(k) in {'id', 'campaignid', 'broadcastid'} and not isinstance(v, (dict, list))]
                           and not any(key(k) in {'messageid', 'contactid', 'recipientid', 'phone', 'phonenumber'} for k in obj)]
              references = set()
              templates = []
              parameters = []
              for campaign in campaigns:
                  for k, value in campaign.items():
                      if key(k) in {'template', 'templateid', 'templatename', 'messagetemplate', 'templatedata', 'templatecontent'}:
                          if isinstance(value, dict):
                              templates.append(value)
                              references.update(str(v) for k2, v in value.items() if key(k2) in {'id', 'name', 'templatename', 'templateid'} and isinstance(v, str))
                          elif isinstance(value, str):
                              references.add(value)
                      if key(k) in {'templateparams', 'templateparameters', 'bodyparameters', 'parameters'} and isinstance(value, list):
                          parameters.append(value)
              # Join template objects only by an exact campaign reference.
              for obj in objects:
                  identities = {str(v) for k, v in obj.items() if key(k) in {'id', 'name', 'templatename', 'templateid'} and isinstance(v, str)}
                  if identities & references:
                      templates.append(obj)
              rendered = set()
              for template in templates:
                  parts = []
                  for field in ('header', 'body', 'footer'):
                      value = template.get(field)
                      if isinstance(value, dict):
                          value = value.get('text')
                      if isinstance(value, str) and value.strip():
                          parts.append(value.strip())
                  components = template.get('components') or template.get('templateComponents') or []
                  if isinstance(components, list):
                      for component in components:
                          if not isinstance(component, dict):
                              continue
                          text = component.get('text')
                          if isinstance(text, str) and text.strip():
                              parts.append(text.strip())
                          buttons = component.get('buttons') or []
                          if isinstance(buttons, list):
                              for button in buttons:
                                  if isinstance(button, dict) and button.get('text'):
                                      parts.append(str(button['text']) + (' — ' + str(button['url']) if button.get('url') else ''))
                  if not parts:
                      for field in ('content', 'text', 'message'):
                          value = template.get(field)
                          if isinstance(value, str) and value.strip():
                              parts.append(value.strip())
                              break
                  text = '\n\n'.join(parts)
                  if text:
                      # Substitute only a single unambiguous campaign parameter list.
                      if len(parameters) == 1:
                          for index, value in enumerate(parameters[0], 1):
                              value = value.get('text') if isinstance(value, dict) else value
                              if isinstance(value, str):
                                  text = text.replace('{{' + str(index) + '}}', value)
                      rendered.add(text)
              if len(rendered) == 1:
                  text = next(iter(rendered))
                  status = 'Template placeholders remain' if re.search(r'{{.*?}}|\$FirstName|\$Name', text, re.I) else 'Captured template text'
                  return text, status, 'Campaign-linked template response'
              return '', 'Content unavailable', ''

          def content_from_preview(page):
              # The sent message is the white preview card shown below Overview.
              # It contains prose, external links and optionally a video/image.
              return page.evaluate(r"""() => {
                  const forbidden = /(?:^|\n)\s*(?:Campaign Type|Total Credit Usage|Campaign Messages \(per day\)|Rows per page:|Created At|Campaign Duration|Template Name)\s*(?:\n|$)/i;
                  const seeds = [];
                  for (const el of document.querySelectorAll('video,video source,a[href],img')) {
                      const url = el.currentSrc || el.src || el.href || '';
                      if (el.tagName === 'VIDEO' || el.tagName === 'SOURCE') seeds.push({el,priority:0});
                      else if (el.tagName === 'A' && /^https?:/.test(url) && !/(?:^|\.)aisensy\.com$/.test(new URL(url).hostname)) seeds.push({el,priority:1});
                      else if (el.tagName === 'IMG' && !/logo|icon|avatar/i.test(url)) seeds.push({el,priority:2});
                  }
                  // Text-only broadcasts have no media; locate their greeting.
                  for (const el of document.querySelectorAll('p,div,span')) {
                      const text = (el.innerText || '').trim();
                      if (/^(?:Dear|Hi|Hello)\b/i.test(text) && text.length >= 80 && !forbidden.test(text)) seeds.push({el,priority:0});
                  }
                  const candidates = [];
                  for (const seed of seeds) {
                      let el = seed.el;
                      for (let i=0; el && i<10; i++,el=el.parentElement) {
                          if (el.tagName === 'BODY' || el.tagName === 'HTML') break;
                          if (!el.getClientRects().length) continue;
                          const text = (el.innerText || '').trim();
                          if (text.length < 80 || text.length > 48000 || forbidden.test(text)) continue;
                          if (/^(?:Manage|Live Chat|Contacts|Campaigns|History|All Projects)(?:\n|$)/i.test(text)) continue;
                          const links = Array.from(el.querySelectorAll('a[href]')).map(a=>a.href).filter(u=>/^https?:/.test(u));
                          const media = Array.from(el.querySelectorAll('video,video source,img[src]')).map(a=>a.currentSrc || a.src).filter(u=>u && /^https?:/.test(u) && !/logo|icon|avatar|whatsapp/i.test(u));
                          candidates.push({text,priority:seed.priority,urls:[...new Set([...links,...media])]});
                      }
                  }
                  if (!candidates.length) return '';
                  const bestPriority = Math.min(...candidates.map(c=>c.priority));
                  const ranked = candidates.filter(c=>c.priority === bestPriority).sort((a,b)=>b.text.length-a.text.length);
                  const best = ranked[0];
                  // Compare the text before appending URLs; media ancestors can
                  // otherwise look like conflicting candidates for the same card.
                  if (!ranked.every(c=>best.text.includes(c.text))) return '';
                  let result = best.text;
                  for (const url of best.urls) if (!result.includes(url)) result += '\n' + url;
                  return result;
              }""")

          def fetch_broadcast_content(page, payloads, campaign_id):
              try:
                  # Scrolling loads lazy-rendered previews below the overview cards.
                  page.evaluate('''() => {
                      window.scrollTo(0, document.body.scrollHeight);
                      for (const el of document.querySelectorAll('main,section,div')) {
                          const overflow = getComputedStyle(el).overflowY;
                          if (/(auto|scroll)/.test(overflow) && el.scrollHeight > el.clientHeight) {
                              el.scrollTop = el.scrollHeight;
                          }
                      }
                  }''')
                  page.wait_for_timeout(800)
                  text = content_from_preview(page)
                  if text:
                      status = 'Template placeholders remain' if re.search(r'{{.*?}}|\$FirstName|\$Name', text, re.I) else 'Captured preview'
                      return text, status, 'AiSensy WhatsApp message preview'
                  result = content_from_campaign(page.locator('body').inner_text(), payloads, campaign_id)
                  if result[0]:
                      return result
                  result = linked_template_content(payloads, campaign_id)
                  if result[0]:
                      return result
                  print(f'Content preview/template unavailable for {campaign_id}; preserving any previous message.', flush=True)
                  return '', 'Content unavailable', ''
              except Exception as exc:
                  print(f'Optional content extraction failed for {campaign_id}: {type(exc).__name__}', flush=True)
                  return '', 'Content lookup failed; previous value retained', ''

          def fetch_campaign(page, name, campaign_id=None):
              with campaign_responses(page) as payloads, content_responses(page) as content_payloads:
                  if campaign_id:
                      page.goto(f'{LIST_URL}/view/{campaign_id}', wait_until='domcontentloaded', timeout=30000)
                      page.wait_for_url(re.compile(rf'/campaigns/all/view/{re.escape(campaign_id)}(?:[/?#]|$)'), timeout=30000)
                  else:
                      wait_for_list(page)
                      target = page.get_by_text(name, exact=True).first
                      target.wait_for(timeout=20000)
                      target.click(timeout=20000)
                      page.wait_for_url(re.compile(r'/campaigns/all/view/[A-Za-z0-9]+'), timeout=30000)
                  page.get_by_text('Total Credit Usage', exact=True).first.wait_for(timeout=30000)
                  page.wait_for_timeout(500)
                  campaign_id = re.search(r'/view/([A-Za-z0-9]+)', page.url).group(1)
                  body = page.locator('body').inner_text()
                  values = {
                      'Audience Size': metric(body, 'Audience'),
                      'Sent': metric(body, 'Sent'),
                      'Delivered': metric(body, 'Delivered'),
                      'Read': metric(body, 'Read'),
                      'Failed': failed_count(body),
                      'Actual Cost': money(body),
                  }
                  missing = [key for key, value in values.items() if value is None]
                  if missing:
                      raise RuntimeError(f'Missing metrics for {name}: {missing}')
                  if contents_by_id.get(campaign_id, {}).get('Message Content') and 'placeholder' not in str(contents_by_id[campaign_id].get('Content Status', '')).lower():
                      message_content, content_status, content_source = '', '', ''
                  else:
                      message_content, content_status, content_source = fetch_broadcast_content(page, content_payloads, campaign_id)
                  kind = re.search(r'(?im)^\s*Campaign Type\s*\n\s*([A-Z_]+)', body)
                  record = {
                      'Campaign ID': campaign_id,
                      'Campaign Name': name,
                      'Date': date_from_body(body),
                      'Displayed Campaign Time (IST)': displayed_campaign_time(body),
                      'Broadcast Sent At (IST)': resolve_sent_time(body, payloads, campaign_id),
                      'Campaign Type': kind.group(1) if kind else 'BROADCAST',
                      **values,
                      'Cost per Message': (values['Actual Cost'] / values['Sent']) if values['Sent'] else 0.0,
                      'Estimated Cost': '',
                      'Last Updated': ist_now(),
                      'Message Content': message_content,
                      'Content Status': content_status,
                      'Content Source': content_source,
                  }
                  if not record['Broadcast Sent At (IST)']:
                      print(f'No usable explicit sent timestamp for {name}; retaining any historical value.', flush=True)
                  print(f"Fetched {name}: sent={record['Sent']}, delivered={record['Delivered']}, cost=INR {record['Actual Cost']}", flush=True)
                  return record

          def existing_record(row):
              padded = list(row[:15]) + [''] * max(0, 15 - len(row))
              rec = dict(zip(HEADERS, padded))
              for field in ('Audience Size', 'Sent', 'Delivered', 'Read', 'Failed'):
                  rec[field] = count(rec[field])
              for field in ('Cost per Message', 'Estimated Cost', 'Actual Cost'):
                  rec[field] = number(rec[field])
              rec['Last Updated'] = existing_time_to_ist(rec.get('Last Updated', ''))
              rec['Campaign ID'] = str(rec['Campaign ID']).strip()
              # Migrate a timestamp column from earlier versions before clearing it.
              rec['Broadcast Sent At (IST)'] = str(row[15]).strip() if len(row) > 15 else ''
              if not rec['Broadcast Sent At (IST)'] and ':' in str(rec['Date']):
                  rec['Broadcast Sent At (IST)'] = str(rec['Date'])
              return rec

          def output_row(rec):
              sent, delivered, read = count(rec['Sent']), count(rec['Delivered']), count(rec['Read'])
              rate = number(rec['Actual Cost']) / sent if sent else 0.0
              return [
                  rec['Campaign ID'], rec['Campaign Name'], date_with_time(rec), rec['Campaign Type'],
                  count(rec['Audience Size']), sent, delivered, read, count(rec['Failed']),
                  delivered / sent if sent else 0, read / delivered if delivered else 0,
                  rate, '', number(rec['Actual Cost']), rec['Last Updated'],
              ]

          def ensure_rows(ws, minimum):
              if ws.row_count < minimum:
                  ws.add_rows(minimum - ws.row_count)

          def update_values(ws, range_name, rows):
              ws.update(range_name=range_name, values=rows, value_input_option='RAW')

          def same_cell(old, new):
              if str(old or '') == str(new if new is not None else ''):
                  return True
              if isinstance(new, (int, float)) and not isinstance(new, bool):
                  try:
                      return abs(float(old) - new) <= 1e-9 * max(1, abs(new))
                  except (ValueError, TypeError):
                      pass
              return False

          def chronological_time(value):
              value = str(value or '').strip()
              for fmt in ('%Y-%m-%d %I:%M:%S %p IST', '%Y-%m-%d'):
                  try:
                      return datetime.strptime(value, fmt).replace(tzinfo=IST).timestamp()
                  except ValueError:
                      pass
              try:
                  parsed = datetime.fromisoformat(value.replace('Z', '+00:00'))
                  return parsed.replace(tzinfo=parsed.tzinfo or IST).timestamp()
              except ValueError:
                  return float('-inf')

          def newest_activity(rec):
              return max(chronological_time(date_with_time(rec)), chronological_time(rec.get('Last Updated')))

          def historical_batch(ids, cursor, limit):
              ids = sorted(set(ids))
              if not ids:
                  return [], ''
              start = ids.index(cursor) if cursor in ids else next((i for i, cid in enumerate(ids) if cid > cursor), 0)
              size = min(limit, len(ids))
              selected = [ids[(start + i) % len(ids)] for i in range(size)]
              return selected, ids[(start + size) % len(ids)]

          def sort_campaign_rows(ws, positions, desired_ids):
              # Move whole rows so custom notes/columns stay with their campaign.
              last_row = max(positions.values(), default=1)
              by_row = {index: cid for cid, index in positions.items()}
              current = [by_row.get(index, ('blank', index)) for index in range(2, last_row + 1)]
              requests = []
              for target, cid in enumerate(desired_ids):
                  source = current.index(cid)
                  if source == target:
                      continue
                  # Earlier desired rows are already fixed; every move is upward.
                  requests.append({'moveDimension': {
                      'source': {'sheetId': ws.id, 'dimension': 'ROWS',
                                 'startIndex': source + 1, 'endIndex': source + 2},
                      'destinationIndex': target + 1,
                  }})
                  current.insert(target, current.pop(source))
              for start in range(0, len(requests), 100):
                  spreadsheet.batch_update({'requests': requests[start:start+100]})

          def upsert_table(ws, headers, rows, end_col):
              # Campaign ID is the key. Refresh changed cells, append new IDs, then sort whole rows.
              existing = ws.get_all_values()
              positions = {}
              for index, row in enumerate(existing[1:], 2):
                  if row and str(row[0]).strip():
                      cid = str(row[0]).strip()
                      if cid in positions:
                          raise RuntimeError(f'Duplicate Campaign ID in {ws.title}: {cid}; table was not rewritten.')
                      positions[cid] = index
              updates = []
              if not existing or existing[0][:len(headers)] != headers:
                  updates.append({'range': f'A1:{end_col}1', 'values': [headers]})
              next_row = max(2, len(existing) + 1)
              for row in rows:
                  cid = str(row[0]).strip()
                  index = positions.get(cid)
                  if index is None:
                      index = next_row
                      next_row += 1
                      positions[cid] = index
                      updates.append({'range': f'A{index}:{end_col}{index}', 'values': [row]})
                  else:
                      old = existing[index-1][:len(headers)]
                      old += [''] * (len(headers) - len(old))
                      if not all(same_cell(a, b) for a, b in zip(old, row)):
                          updates.append({'range': f'A{index}:{end_col}{index}', 'values': [row]})
              ensure_rows(ws, max(positions.values(), default=1))
              # Bound request size while retaining unrelated cells and columns.
              for start in range(0, len(updates), 100):
                  ws.batch_update(updates[start:start+100], value_input_option='RAW')
              sort_campaign_rows(ws, positions, [str(row[0]).strip() for row in rows])

          session_json = os.environ.get('AISENSY_SESSION', '').strip()
          google_json = (os.environ.get('GOOGLE_SERVICE_ACCOUNT_JSON', '').strip()
                         or os.environ.get('GOOGLE_CREDENTIALS', '').strip())
          if not session_json:
              raise RuntimeError('Missing AISENSY_SESSION secret')
          if not google_json:
              raise RuntimeError('Missing GOOGLE_SERVICE_ACCOUNT_JSON secret')
          session = json.loads(session_json)
          credentials = Credentials.from_service_account_info(
              json.loads(google_json), scopes=['https://www.googleapis.com/auth/spreadsheets'])
          spreadsheet = gspread.authorize(credentials).open_by_key(SHEET_ID)
          data_ws = spreadsheet.worksheet('Broadcast_Data')
          summary_ws = spreadsheet.worksheet('Cost Summary')
          dashboard_ws = spreadsheet.worksheet('Dashboard')

          sheets_by_title = {ws.title: ws for ws in spreadsheet.worksheets()}
          sync_metadata = spreadsheet.fetch_sheet_metadata()
          cursor_entries = [entry for entry in sync_metadata.get('developerMetadata', [])
                            if entry.get('metadataKey') == 'aisensy_history_cursor']
          cursor_entry = cursor_entries[0] if cursor_entries else None
          history_cursor = cursor_entry.get('metadataValue', '') if cursor_entry else ''
          next_history_cursor = history_cursor

          analysis_ws = sheets_by_title.get('Broadcast Analysis')
          source_times = read_analysis_times(analysis_ws) if analysis_ws else {}
          contents_ws = sheets_by_title.get('Broadcast Contents')
          contents_by_id = {}
          if contents_ws:
              for row in contents_ws.get_all_records():
                  cid = str(row.get('Campaign ID', '')).strip()
                  if cid:
                      contents_by_id[cid] = row

          webinar_ws = sheets_by_title.get('Webinar Dashboard')
          if analysis_ws is None and webinar_ws is None:
              raise RuntimeError('Neither Webinar Dashboard nor Broadcast Analysis exists; no spreadsheet changes were made.')

          existing_rows = data_ws.get_all_values()
          existing_by_id = {}
          order = []
          for row in existing_rows[1:]:
              if not row or not row[0].strip():
                  continue
              rec = existing_record(row)
              cid = rec['Campaign ID']
              if not rec['Broadcast Sent At (IST)']:
                  rec['Broadcast Sent At (IST)'] = source_times.get(cid, '')
              if cid not in existing_by_id:
                  order.append(cid)
              existing_by_id[cid] = rec
          print(f'Historical campaigns retained: {len(order)}', flush=True)

          fetched = []
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              context = browser.new_context(storage_state=session, timezone_id='Asia/Kolkata')
              page = context.new_page()
              names = discover_names(page)
              for name in names:
                  try:
                      fetched.append(fetch_campaign(page, name))
                  except Exception as exc:
                      print(f'WARNING: Skipped {name}: {exc}', flush=True)
              # At most five older campaigns per run, rotating across all history.
              fetched_ids = {rec['Campaign ID'] for rec in fetched}
              candidates = [cid for cid in order if cid not in fetched_ids and re.fullmatch(r'[A-Za-z0-9]+', cid)]
              selected, next_history_cursor = historical_batch(candidates, history_cursor, HISTORICAL_BATCH_SIZE)
              print(f'Historical refresh: {len(selected)} of {len(candidates)} saved campaigns this run.', flush=True)
              for cid in selected:
                  try:
                      rec = fetch_campaign(page, existing_by_id[cid]['Campaign Name'], campaign_id=cid)
                      fetched.append(rec)
                  except Exception as exc:
                      print(f'WARNING: Historical campaign {cid} could not be refreshed; saved row retained: {exc}', flush=True)
              browser.close()

          if not names:
              raise RuntimeError('AiSensy campaign list returned no names. Session may have expired or the page changed; spreadsheet was not modified.')
          if not fetched:
              raise RuntimeError('AiSensy campaigns were listed but none could be fetched. Spreadsheet was not modified.')
          sync_time = ist_now()
          new_ids = {rec['Campaign ID'] for rec in fetched if rec['Campaign ID'] not in existing_by_id}

          # Refresh every successfully fetched campaign on every run.
          # Retain historical campaigns that were not fetched this time.
          if new_ids:
              print(f'{len(new_ids)} new broadcast(s) found; refreshing fetched campaign metrics.', flush=True)
          else:
              print('No new broadcasts; refreshing fetched campaign metrics.', flush=True)

          new_count = 0
          updated_count = 0
          for rec in fetched:
              cid = rec['Campaign ID']
              if not rec.get('Broadcast Sent At (IST)'):
                  rec['Broadcast Sent At (IST)'] = source_times.get(cid, '')
              if cid in existing_by_id:
                  old = existing_by_id[cid]
                  if not rec['Date']:
                      rec['Date'] = old.get('Date', '')
                  if not rec.get('Broadcast Sent At (IST)'):
                      rec['Broadcast Sent At (IST)'] = old.get('Broadcast Sent At (IST)', '')
                  if not rec.get('Broadcast Sent At (IST)'):
                      rec['Broadcast Sent At (IST)'] = rec.get('Displayed Campaign Time (IST)', '')
                  tracked_fields = ('Campaign Name', 'Campaign Type', 'Audience Size', 'Sent', 'Delivered', 'Read', 'Failed', 'Actual Cost', 'Broadcast Sent At (IST)')
                  changed = date_with_time(rec) != date_with_time(old) or any(rec.get(field, '') != old.get(field, '') for field in tracked_fields)
                  if changed:
                      updated_count += 1
                  else:
                      rec['Last Updated'] = old.get('Last Updated', rec['Last Updated'])
              else:
                  if not rec.get('Broadcast Sent At (IST)'):
                      rec['Broadcast Sent At (IST)'] = rec.get('Displayed Campaign Time (IST)', '')
                  order.append(cid)
                  new_count += 1
              existing_by_id[cid] = rec

          # New broadcasts and genuinely changed metrics rise to the top.
          # Checking an unchanged campaign does not change its Last Updated time.
          records = sorted(
              (existing_by_id[cid] for cid in order),
              key=lambda rec: (newest_activity(rec), chronological_time(date_with_time(rec)), rec['Campaign ID']),
              reverse=True,
          )
          missing_source_ids = set(source_times) - set(existing_by_id)
          if missing_source_ids:
              raise RuntimeError('Source times include campaigns missing from Broadcast_Data; no cleanup was performed.')
          data_rows = [output_row(rec) for rec in records]
          upsert_table(data_ws, HEADERS, data_rows, 'O')
          data_ws.format(f'C2:C{len(data_rows)+1}', {'numberFormat': {'type': 'TEXT'}})
          data_ws.format(f'O2:O{len(data_rows)+1}', {'numberFormat': {'type': 'TEXT'}})
          data_ws.format(f'E2:I{len(data_rows)+1}', {'numberFormat': {'type': 'NUMBER', 'pattern': '#,##0'}})
          data_ws.format(f'J2:K{len(data_rows)+1}', {'numberFormat': {'type': 'PERCENT', 'pattern': '0.00%'}})
          data_ws.format(f'L2:L{len(data_rows)+1}', {'numberFormat': {'type': 'CURRENCY', 'pattern': '₹#,##0.000'}})
          data_ws.format(f'N2:N{len(data_rows)+1}', {'numberFormat': {'type': 'CURRENCY', 'pattern': '₹#,##0.00'}})

          summary_header = [
              'Campaign ID', 'Campaign Name', 'Date', 'Audience', 'Sent', 'Delivered',
              'Read', 'Failed', 'Actual Cost (INR)', 'Cost per Sent',
              'Cost per Delivered', 'Last Updated',
          ]
          summary_rows = []
          for rec in records:
              sent = count(rec['Sent'])
              delivered = count(rec['Delivered'])
              cost = number(rec['Actual Cost'])
              summary_rows.append([
                  rec['Campaign ID'], rec['Campaign Name'], date_with_time(rec),
                  count(rec['Audience Size']), sent, delivered, count(rec['Read']),
                  count(rec['Failed']), cost, cost / sent if sent else 0,
                  cost / delivered if delivered else 0, rec['Last Updated'],
              ])
          upsert_table(summary_ws, summary_header, summary_rows, 'L')
          summary_ws.format(f'C2:C{len(summary_rows)+1}', {'numberFormat': {'type': 'TEXT'}})
          summary_ws.format(f'L2:L{len(summary_rows)+1}', {'numberFormat': {'type': 'TEXT'}})
          summary_ws.format(f'D2:H{len(summary_rows)+1}', {'numberFormat': {'type': 'NUMBER', 'pattern': '#,##0'}})
          summary_ws.format(f'I2:K{len(summary_rows)+1}', {'numberFormat': {'type': 'NUMBER', 'pattern': '#,##0.000'}})

          total_sent = sum(count(rec['Sent']) for rec in records)
          total_delivered = sum(count(rec['Delivered']) for rec in records)
          total_read = sum(count(rec['Read']) for rec in records)
          total_failed = sum(count(rec['Failed']) for rec in records)
          total_cost = sum(number(rec['Actual Cost']) for rec in records)
          dashboard = [
              ['Metric', 'Total'],
              ['Total Broadcasts', len(records)],
              ['Total Audience', sum(count(rec['Audience Size']) for rec in records)],
              ['Total Messages Sent', total_sent],
              ['Total Messages Delivered', total_delivered],
              ['Total Messages Read', total_read],
              ['Total Messages Failed', total_failed],
              ['Total Estimated Cost', 'Not available from AiSensy'],
              ['Total Actual Cost', total_cost],
              ['Overall Delivery Rate', total_delivered / total_sent if total_sent else 0],
              ['Overall Read Rate', total_read / total_delivered if total_delivered else 0],
              ['Average Cost per Sent Message', total_cost / total_sent if total_sent else 0],
              ['Last Sync (IST)', sync_time],
              ['Campaigns Added This Sync', new_count, f'{new_count} new campaign(s) added; {updated_count} existing campaign(s) refreshed'],
              ['CAMPAIGN PERFORMANCE'],
              ['Campaign Name', 'Date', 'Sent', 'Delivered', 'Read', 'Failed', 'Delivery Rate', 'Read Rate', 'Actual Cost (INR)'],
          ]
          for rec in records:
              sent, delivered, read = count(rec['Sent']), count(rec['Delivered']), count(rec['Read'])
              dashboard.append([
                  rec['Campaign Name'], date_with_time(rec), sent, delivered, read, count(rec['Failed']),
                  delivered / sent if sent else 0, read / delivered if delivered else 0,
                  number(rec['Actual Cost']),
              ])
          previous_dashboard = len(dashboard_ws.get_all_values())
          ensure_rows(dashboard_ws, len(dashboard))
          dashboard_ws.batch_clear([f'A1:O{max(previous_dashboard, len(dashboard))}'])
          dashboard[12][1] = ist_now()  # Actual dashboard write time in IST
          update_values(dashboard_ws, f'A1:I{len(dashboard)}', dashboard)
          dashboard_ws.format('B13', {'numberFormat': {'type': 'TEXT'}})
          dashboard_ws.format('B2:B7', {'numberFormat': {'type': 'NUMBER', 'pattern': '#,##0'}})
          dashboard_ws.format('B10:B11', {'numberFormat': {'type': 'PERCENT', 'pattern': '0.00%'}})
          dashboard_ws.format('B8:B9', {'numberFormat': {'type': 'CURRENCY', 'pattern': '₹#,##0.00'}})
          if records:
              dashboard_ws.format(f'B17:B{16+len(records)}', {'numberFormat': {'type': 'TEXT'}})
              dashboard_ws.format(f'C17:F{16+len(records)}', {'numberFormat': {'type': 'NUMBER', 'pattern': '#,##0'}})
              dashboard_ws.format(f'G17:H{16+len(records)}', {'numberFormat': {'type': 'PERCENT', 'pattern': '0.00%'}})
              dashboard_ws.format(f'I17:I{16+len(records)}', {'numberFormat': {'type': 'CURRENCY', 'pattern': '₹#,##0.00'}})

          # Clear only the timestamp columns added by earlier replacements.
          # Do not delete columns, which could shift unrelated references.
          for ws, col, label in (
              (data_ws, 'P', 'Broadcast Sent At (IST)'),
              (summary_ws, 'M', 'Broadcast Sent At (IST)'),
          ):
              if ws.acell(f'{col}1').value == label:
                  ws.batch_clear([f'{col}1:{col}{ws.row_count}'])

          # Replace the first report in place. No schedule/settings tabs are created.
          # If both report tabs exist, retain the existing Broadcast Analysis tab.
          if analysis_ws is None:
              if webinar_ws is None:
                  raise RuntimeError('Neither Webinar Dashboard nor Broadcast Analysis exists; no new tab was created.')
              webinar_ws.update_title('Broadcast Analysis')
              analysis_ws = webinar_ws
              webinar_ws = None

          analysis_headers = [
              'Campaign ID', 'Campaign Name', 'Audience Size', 'Sent', 'Delivered',
              'Read', 'Failed', 'Actual Cost', 'Last Updated', 'Sent At (IST)',
              'Send Day', 'Send Hour', 'Webinar Start (inferred)', 'Webinar (inferred)',
              'Webinar Date (inferred)', 'Hours Before Start', 'Timing Stage (inferred)',
              'Message Type', 'Content Angle', 'Delivery Rate', 'Read Rate',
              'Cost per Read', 'Data Status', 'Ranked', 'Data Check',
          ]
          analysis_rows = []
          for rec in records:
              sent, delivered, read = count(rec['Sent']), count(rec['Delivered']), count(rec['Read'])
              cost = number(rec['Actual Cost'])
              stamp = rec.get('Broadcast Sent At (IST)', '')
              try:
                  local = datetime.strptime(stamp, '%Y-%m-%d %I:%M:%S %p IST').replace(tzinfo=IST)
              except ValueError:
                  local = None
              name = rec['Campaign Name'].lower()
              if 'renew' in name:
                  message_type = 'Renewal offer'
              elif any(word in name for word in ('live', 'started', 'joinnow')):
                  message_type = 'Live now'
              elif any(word in name for word in ('missed', 're-register', 'reregister')):
                  message_type = 'Missed / re-register'
              elif any(word in name for word in ('closing', 'deadline', 'lastchance', 'last chance')):
                  message_type = 'Sales / closing'
              else:
                  message_type = 'Reminder'
              angle = 'General'
              for words, category in (
                  (('closing', 'deadline', 'last chance'), 'Deadline / closing'),
                  (('income', 'earn', 'salary'), 'Income'),
                  (('bonus',), 'Bonus'), (('discount', 'offer'), 'Offer'),
                  (('faceless',), 'Faceless'),
              ):
                  if any(word in name for word in words):
                      angle = category
                      break
              webinar_start = None
              if local and message_type != 'Renewal offer':
                  candidates = []
                  # Existing webinar schedule, kept in code rather than another tab.
                  for offset in range(-1, 8):
                      day = (local + timedelta(days=offset)).date()
                      for weekday, hour, minute in ((6, 11, 0), (6, 19, 30), (1, 19, 30), (2, 19, 30)):
                          if day.weekday() != weekday:
                              continue
                          start = datetime(day.year, day.month, day.day, hour, minute, tzinfo=IST)
                          if start >= local - timedelta(minutes=90):
                              candidates.append(start)
                  if candidates:
                      webinar_start = min(candidates)
              hours_before = (webinar_start - local).total_seconds() / 3600 if webinar_start else ''
              stage = ''
              if webinar_start:
                  if hours_before <= 0:
                      stage = 'Live / after start'
                  elif hours_before < 1:
                      stage = 'Within 1 hour before'
                  elif hours_before <= 6:
                      stage = '1 to 6 hours before'
                  elif local.date() == webinar_start.date():
                      stage = 'Same day, 6h+ before'
                  elif (webinar_start.date() - local.date()).days == 1:
                      stage = 'Day before'
                  else:
                      stage = '2+ days before'
              final = bool(local and datetime.now(IST) - local >= timedelta(hours=18))
              status = 'Final' if final else ('Still collecting' if local else 'Time unavailable')
              issues = []
              if delivered > sent:
                  issues.append('Delivered count is higher than sent')
              if read > delivered:
                  issues.append('Read count is higher than delivered')
              if count(rec['Failed']) > count(rec['Audience Size']):
                  issues.append('Failed count is higher than audience')
              if sent and delivered / sent < 0.8:
                  issues.append('Low delivery rate')
              if count(rec['Audience Size']) and count(rec['Failed']) / count(rec['Audience Size']) > 0.1:
                  issues.append('High failure rate')
              analysis_rows.append([
                  rec['Campaign ID'], rec['Campaign Name'], count(rec['Audience Size']),
                  sent, delivered, read, count(rec['Failed']), cost, rec['Last Updated'],
                  stamp, local.strftime('%a') if local else '', local.hour if local else '',
                  webinar_start.strftime('%Y-%m-%d %I:%M:%S %p IST') if webinar_start else '',
                  webinar_start.strftime('%a %I:%M %p') if webinar_start else '',
                  webinar_start.strftime('%Y-%m-%d') if webinar_start else '',
                  hours_before, stage, message_type, angle,
                  delivered / sent if sent else 0, read / delivered if delivered else 0,
                  cost / read if read else '', status,
                  'Yes' if final and sent >= 200 and message_type != 'Renewal offer' and not issues else 'No',
                  '; '.join(issues),
              ])
          if analysis_ws.col_count < len(analysis_headers):
              analysis_ws.add_cols(len(analysis_headers) - analysis_ws.col_count)
          ensure_rows(analysis_ws, len(analysis_rows) + 1)
          upsert_table(analysis_ws, analysis_headers, analysis_rows, 'Y')
          spreadsheet.batch_update({'requests': [{'setDataValidation': {'range': {'sheetId': analysis_ws.id}, 'rule': None}}]})
          analysis_ws.freeze(rows=1)
          analysis_ws.format(f'C2:G{len(analysis_rows)+1}', {'numberFormat': {'type': 'NUMBER', 'pattern': '#,##0'}})
          analysis_ws.format(f'T2:U{len(analysis_rows)+1}', {'numberFormat': {'type': 'PERCENT', 'pattern': '0.00%'}})
          for col in ('H', 'V'):
              analysis_ws.format(f'{col}2:{col}{len(analysis_rows)+1}', {'numberFormat': {'type': 'NUMBER', 'pattern': '#,##0.00'}})
          for col in ('I', 'J', 'M', 'O'):
              analysis_ws.format(f'{col}2:{col}{len(analysis_rows)+1}', {'numberFormat': {'type': 'TEXT'}})
          analysis_ws.format(f'L2:L{len(analysis_rows)+1}', {'numberFormat': {'type': 'NUMBER', 'pattern': '0'}})
          analysis_ws.format(f'P2:P{len(analysis_rows)+1}', {'numberFormat': {'type': 'NUMBER', 'pattern': '0.00'}})

          # Keep one webinar dashboard, reusing the former schedule tab if present.
          schedule_ws = sheets_by_title.get('Broadcast Schedule')
          if webinar_ws is None:
              if schedule_ws is not None:
                  schedule_ws.update_title('Webinar Dashboard')
                  webinar_ws = schedule_ws
                  schedule_ws = None
              else:
                  webinar_ws = spreadsheet.add_worksheet(title='Webinar Dashboard', rows=120, cols=20)

          # Summary figures use current records; timing groups remain inferred.
          groups = {}
          for row in analysis_rows:
              webinar = row[13] or 'Unassigned / renewals'
              if webinar not in groups:
                  groups[webinar] = [0, 0, 0, 0, 0, 0.0]
              group = groups[webinar]
              for index, value in enumerate((1, row[3], row[4], row[5], row[6], row[7])):
                  group[index] += value
          webinar_rows = [
              ['Webinar Broadcast Dashboard'],
              ['Last refreshed (IST)', ist_now()],
              ['Webinar matching is inferred from send time and the configured weekly schedule.'],
              ['Metric', 'Value'],
              ['Broadcasts', len(records)],
              ['Messages sent', total_sent],
              ['Messages delivered', total_delivered],
              ['Messages read', total_read],
              ['Messages failed', total_failed],
              ['Actual cost (INR)', total_cost],
              ['Delivery rate', total_delivered / total_sent if total_sent else 0],
              ['Read rate', total_read / total_delivered if total_delivered else 0],
              ['Cost per read (INR)', total_cost / total_read if total_read else ''],
              ['Broadcasts with date and time', sum(bool(rec.get('Broadcast Sent At (IST)')) for rec in records)],
              [],
              ['Performance by webinar (inferred)'],
              ['Webinar', 'Broadcasts', 'Sent', 'Delivered', 'Read', 'Failed', 'Actual Cost (INR)', 'Delivery Rate', 'Read Rate', 'Cost per Read'],
          ]
          for label, values in sorted(groups.items()):
              broadcasts, sent, delivered, read, failed, cost = values
              webinar_rows.append([label, broadcasts, sent, delivered, read, failed, cost,
                                   delivered / sent if sent else 0, read / delivered if delivered else 0,
                                   cost / read if read else ''])
          message_heading = len(webinar_rows) + 2
          webinar_rows += [[], ['Performance by message type'],
                           ['Message Type', 'Broadcasts', 'Sent', 'Delivered', 'Read', 'Read Rate', 'Actual Cost (INR)', 'Cost per Read']]
          message_groups = {}
          for row in analysis_rows:
              label = row[17]
              group = message_groups.setdefault(label, [0, 0, 0, 0, 0.0])
              for index, value in enumerate((1, row[3], row[4], row[5], row[7])):
                  group[index] += value
          for label, values in sorted(message_groups.items()):
              broadcasts, sent, delivered, read, cost = values
              webinar_rows.append([label, broadcasts, sent, delivered, read,
                                   read / delivered if delivered else 0, cost, cost / read if read else ''])
          top_heading = len(webinar_rows) + 2
          webinar_rows += [[], ['Latest broadcasts and metric updates'],
                           ['Campaign Name', 'Date and Time (IST)', 'Sent', 'Delivered', 'Read', 'Read Rate', 'Actual Cost (INR)', 'Cost per Read']]
          eligible = analysis_rows[:10]
          for row in eligible:
              webinar_rows.append([row[1], row[9], row[3], row[4], row[5], row[20], row[7], row[21]])
          if not eligible:
              webinar_rows.append(['No broadcast records available.'])
          if webinar_ws.col_count < 20:
              webinar_ws.add_cols(20 - webinar_ws.col_count)
          ensure_rows(webinar_ws, max(100, len(webinar_rows)))
          webinar_ws.clear()
          update_values(webinar_ws, 'A1', webinar_rows)
          spreadsheet.batch_update({'requests': [{'setDataValidation': {'range': {'sheetId': webinar_ws.id}, 'rule': None}}]})
          webinar_ws.freeze(rows=1)
          webinar_ws.format(f'A1:J{len(webinar_rows)}', {
              'backgroundColor': {'red': 1, 'green': 1, 'blue': 1},
              'textFormat': {'foregroundColor': {'red': 0.12, 'green': 0.16, 'blue': 0.2}, 'fontSize': 10},
          })
          webinar_ws.format('A1', {'textFormat': {'bold': True, 'fontSize': 18}})
          for header_row in (4, 17, message_heading + 1, top_heading + 1):
              webinar_ws.format(f'A{header_row}:J{header_row}', {
                  'backgroundColor': {'red': 0.12, 'green': 0.3, 'blue': 0.27},
                  'textFormat': {'bold': True, 'foregroundColor': {'red': 1, 'green': 1, 'blue': 1}},
                  'wrapStrategy': 'WRAP',
              })

          webinar_ws.format('B11:B12', {'numberFormat': {'type': 'PERCENT', 'pattern': '0.00%'}})
          webinar_ws.format('B10', {'numberFormat': {'type': 'NUMBER', 'pattern': '#,##0.00'}})
          webinar_ws.format('B13', {'numberFormat': {'type': 'NUMBER', 'pattern': '#,##0.00'}})
          if groups:
              webinar_ws.format(f'H18:I{17+len(groups)}', {'numberFormat': {'type': 'PERCENT', 'pattern': '0.00%'}})
              for col in ('G', 'J'):
                  webinar_ws.format(f'{col}18:{col}{17+len(groups)}', {'numberFormat': {'type': 'NUMBER', 'pattern': '#,##0.00'}})
          if message_groups:
              start = message_heading + 2
              webinar_ws.format(f'F{start}:F{start+len(message_groups)-1}', {'numberFormat': {'type': 'PERCENT', 'pattern': '0.00%'}})
          if eligible:
              start = top_heading + 2
              webinar_ws.format(f'F{start}:F{start+len(eligible)-1}', {'numberFormat': {'type': 'PERCENT', 'pattern': '0.00%'}})

          # Replace dashboard charts, preventing duplicate charts on every run.
          chart_requests = []
          metadata = sync_metadata
          for sheet in metadata.get('sheets', []):
              if sheet.get('properties', {}).get('sheetId') == webinar_ws.id:
                  for chart in sheet.get('charts', []):
                      chart_requests.append({'deleteEmbeddedObject': {'objectId': chart['chartId']}})
          def chart_range(start_col, end_col):
              return {'sheetId': webinar_ws.id, 'startRowIndex': 16,
                      'endRowIndex': 17 + len(groups), 'startColumnIndex': start_col, 'endColumnIndex': end_col}
          if groups:
              for title, columns, row_anchor in (
                  ('Messages delivered and read by webinar', ((3, 4), (4, 5)), 3),
                  ('Read rate by webinar', ((8, 9),), 22),
              ):
                  chart_requests.append({'addChart': {'chart': {
                      'spec': {'title': title, 'basicChart': {
                          'chartType': 'COLUMN', 'legendPosition': 'BOTTOM_LEGEND', 'headerCount': 1,
                          'axis': [{'position': 'BOTTOM_AXIS', 'title': 'Webinar (inferred)'},
                                   {'position': 'LEFT_AXIS', 'title': 'Read rate' if len(columns) == 1 else 'Messages'}],
                          'domains': [{'domain': {'sourceRange': {'sources': [chart_range(0, 1)]}}}],
                          'series': [{'series': {'sourceRange': {'sources': [chart_range(a, b)]}}, 'targetAxis': 'LEFT_AXIS'} for a, b in columns],
                      }},
                      'position': {'overlayPosition': {'anchorCell': {'sheetId': webinar_ws.id, 'rowIndex': row_anchor, 'columnIndex': 11},
                                                       'widthPixels': 650, 'heightPixels': 350}},
                  }}})
          chart_requests += [
              {'updateDimensionProperties': {'range': {'sheetId': webinar_ws.id, 'dimension': 'COLUMNS', 'startIndex': 0, 'endIndex': 1}, 'properties': {'pixelSize': 310}, 'fields': 'pixelSize'}},
              {'updateDimensionProperties': {'range': {'sheetId': webinar_ws.id, 'dimension': 'COLUMNS', 'startIndex': 1, 'endIndex': 10}, 'properties': {'pixelSize': 140}, 'fields': 'pixelSize'}},
          ]
          spreadsheet.batch_update({'requests': chart_requests})

          if contents_ws is None:
              contents_ws = spreadsheet.add_worksheet(title='Broadcast Contents', rows=max(100, len(records)+1), cols=8)
          content_headers = ['Campaign ID', 'Campaign Name', 'Date and Time (IST)', 'Message Content',
                             'Content Status', 'Content Source', 'Content Updated (IST)', 'Metrics Updated (IST)']
          content_rows = []
          fetched_by_id = {rec['Campaign ID']: rec for rec in fetched}
          for rec in records:
              cid = rec['Campaign ID']
              previous = contents_by_id.get(cid, {})
              fresh = fetched_by_id.get(cid, {})
              text = fresh.get('Message Content') or previous.get('Message Content', '')
              status = fresh.get('Content Status') if fresh.get('Message Content') else previous.get('Content Status', 'Content unavailable')
              source = fresh.get('Content Source') if fresh.get('Message Content') else previous.get('Content Source', '')
              content_time = fresh.get('Last Updated') if fresh.get('Message Content') else previous.get('Content Updated (IST)', '')
              # Google Sheets cells are limited to 50,000 characters. Never truncate silently.
              if len(str(text)) > 50000:
                  raise RuntimeError(f'Content exceeds the Google Sheets cell limit for {cid}; previous content tab retained.')
              content_rows.append([cid, rec['Campaign Name'], date_with_time(rec), text, status, source, content_time, rec['Last Updated']])
          ensure_rows(contents_ws, len(content_rows)+1)
          if contents_ws.col_count < 8:
              contents_ws.add_cols(8 - contents_ws.col_count)
          upsert_table(contents_ws, content_headers, content_rows, 'H')
          contents_ws.freeze(rows=1)
          contents_ws.format(f'D2:D{len(content_rows)+1}', {'wrapStrategy': 'WRAP', 'verticalAlignment': 'TOP'})
          spreadsheet.batch_update({'requests': [
              {'updateDimensionProperties': {'range': {'sheetId': contents_ws.id, 'dimension': 'COLUMNS', 'startIndex': 3, 'endIndex': 4}, 'properties': {'pixelSize': 650}, 'fields': 'pixelSize'}},
              {'updateDimensionProperties': {'range': {'sheetId': contents_ws.id, 'dimension': 'COLUMNS', 'startIndex': 1, 'endIndex': 3}, 'properties': {'pixelSize': 260}, 'fields': 'pixelSize'}},
              {'autoResizeDimensions': {'dimensions': {'sheetId': contents_ws.id, 'dimension': 'ROWS', 'startIndex': 1, 'endIndex': len(content_rows)+1}}},
          ]})

          # Persist rotation only after all report writes succeeded. Spreadsheet
          # metadata stores the cursor without adding tabs or visible cells.
          if next_history_cursor != history_cursor:
              if cursor_entry:
                  cursor_request = {'updateDeveloperMetadata': {
                      'dataFilters': [{'developerMetadataLookup': {'metadataId': cursor_entry['metadataId']}}],
                      'developerMetadata': {'metadataValue': next_history_cursor},
                      'fields': 'metadataValue',
                  }}
              else:
                  cursor_request = {'createDeveloperMetadata': {'developerMetadata': {
                      'metadataKey': 'aisensy_history_cursor', 'metadataValue': next_history_cursor,
                      'visibility': 'DOCUMENT', 'location': {'spreadsheet': True},
                  }}}
              spreadsheet.batch_update({'requests': [cursor_request]})

          print(f'Sync complete: {new_count} new, {updated_count} updated, {len(records)} total campaigns.', flush=True)
          PY

      - name: Record failed sync in Dashboard
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import gspread
          from google.oauth2.service_account import Credentials

          raw = os.environ.get('GOOGLE_SERVICE_ACCOUNT_JSON', '').strip() or os.environ.get('GOOGLE_CREDENTIALS', '').strip()
          if not raw:
              raise RuntimeError('No Google credentials to report failed sync')

          creds = Credentials.from_service_account_info(
              json.loads(raw),
              scopes=['https://www.googleapis.com/auth/spreadsheets']
          )
          sheet_id = os.environ.get('GOOGLE_SHEET_ID', '').strip() or '1jXnQPQngi-FbEBBHC0tvaOTXxmtE5_miv6Mq0rTbmLQ'
          ws = gspread.authorize(creds).open_by_key(sheet_id).worksheet('Dashboard')
          timestamp = datetime.now(ZoneInfo('Asia/Kolkata')).strftime('%Y-%m-%d %I:%M:%S %p IST')

          # Do not overwrite Last Sync: it records the last successful sync.
          ws.update(
              range_name='C14',
              values=[[f'FAILED check at {timestamp}; see GitHub Actions logs']],
              value_input_option='RAW'
          )
          print('Recorded failure status in Dashboard; last successful sync timestamp retained.')
          PY
