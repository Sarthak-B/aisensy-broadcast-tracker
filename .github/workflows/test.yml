name: Export AiSensy Broadcast Analytics

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright google-auth google-api-python-client
          python -m playwright install --with-deps chromium

      - name: Update Google Sheets
        env:
          AISENSY_SESSION: ${{ secrets.AISENSY_SESSION }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from playwright.sync_api import sync_playwright

          PROJECT_ID = "6589906ef69fc70b424e0e43"
          CAMPAIGN_ID = "6acc6b9be85c517b3c81b4b9"
          CAMPAIGN_NAME = "10amremi"
          SHEET = "Broadcast_Data"

          url = (
              f"https://www.app.aisensy.com/projects/"
              f"{PROJECT_ID}/campaigns/all/view/{CAMPAIGN_ID}"
          )

          def metric(lines, label):
              matches = []
              for i, line in enumerate(lines[:-1]):
                  if line.lower() == label.lower():
                      value = lines[i + 1]
                      if re.fullmatch(r"[\d,]+", value):
                          matches.append(
                              int(value.replace(",", ""))
                          )
              if not matches:
                  raise ValueError(f"Missing metric: {label}")
              return matches[-1]

          def cost(lines):
              matches = []
              for i, line in enumerate(lines[:-1]):
                  if line == "Total Credit Usage":
                      found = re.fullmatch(
                          r"₹\s*([\d,]+(?:\.\d+)?)",
                          lines[i + 1]
                      )
                      if found:
                          matches.append(
                              float(found.group(1).replace(",", ""))
                          )
              if not matches:
                  raise ValueError("Missing actual cost")
              return matches[-1]

          state = json.loads(os.environ["AISENSY_SESSION"])

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(storage_state=state)
              page = context.new_page()

              page.goto(url, wait_until="domcontentloaded", timeout=60000)
              page.get_by_text(
                  "Total Credit Usage", exact=True
              ).first.wait_for(timeout=30000)
              page.wait_for_timeout(3000)

              lines = [
                  line.strip()
                  for line in page.locator("body").inner_text().splitlines()
                  if line.strip()
              ]

              audience = metric(lines, "Audience")
              sent = metric(lines, "Sent")
              delivered = metric(lines, "Delivered")
              read = metric(lines, "Read")
              actual_cost = cost(lines)

              # Temporary approximation for this one test campaign.
              failed = audience - sent
              browser.close()

          if not (audience >= sent >= delivered >= 0):
              raise ValueError("Invalid campaign statistics")

          if actual_cost <= 0:
              raise ValueError("Unexpected actual cost")

          credentials = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]),
              scopes=["https://www.googleapis.com/auth/spreadsheets"]
          )

          service = build(
              "sheets", "v4",
              credentials=credentials,
              cache_discovery=False
          )

          spreadsheet_id = os.environ["GOOGLE_SHEET_ID"]
          sheets = service.spreadsheets()

          response = sheets.values().get(
              spreadsheetId=spreadsheet_id,
              range=f"'{SHEET}'!A2:B"
          ).execute()

          existing = response.get("values", [])
          target_row = None

          for index, row in enumerate(existing, start=2):
              if row and row[0] == CAMPAIGN_ID:
                  target_row = index
                  break

          if target_row is None:
              target_row = len(existing) + 2

          # Correct column order:
          # A Campaign ID
          # B Campaign Name
          # C Date
          # D Campaign Type
          # E Audience Size
          # F Sent
          # G Delivered
          # H Read
          # I Failed
          # J Delivery Rate
          # K Read Rate
          # L Cost per Message
          # M Estimated Cost
          # N Actual Cost
          # O Last Updated

          now = datetime.now(timezone.utc).isoformat()

          updates = [
              {
                  "range": f"'{SHEET}'!A{target_row}:B{target_row}",
                  "values": [[CAMPAIGN_ID, CAMPAIGN_NAME]]
              },
              {
                  "range": f"'{SHEET}'!D{target_row}:K{target_row}",
                  "values": [[
                      "BROADCAST",
                      audience,
                      sent,
                      delivered,
                      read,
                      failed,
                      f"=IFERROR(G{target_row}/F{target_row},0)",
                      f"=IFERROR(H{target_row}/G{target_row},0)"
                  ]]
              },
              {
                  "range": f"'{SHEET}'!M{target_row}:O{target_row}",
                  "values": [[
                      f'=IF(OR(G{target_row}="",L{target_row}=""),"",G{target_row}*L{target_row})',
                      actual_cost,
                      now
                  ]]
              }
          ]

          sheets.values().batchUpdate(
              spreadsheetId=spreadsheet_id,
              body={
                  "valueInputOption": "USER_ENTERED",
                  "data": updates
              }
          ).execute()

          print(
              f"Updated {SHEET} row {target_row}: "
              f"sent={sent}, delivered={delivered}, "
              f"read={read}, cost=INR {actual_cost}"
          )
          PY
