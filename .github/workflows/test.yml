name: Test AiSensy Campaign Data

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check AiSensy Dashboard Content
        env:
          AISENSY_SESSION: ${{ secrets.AISENSY_SESSION }}
        run: |
          python - <<'PY'
          import json
          import os
          from playwright.sync_api import sync_playwright

          state = json.loads(os.environ["AISENSY_SESSION"])

          dashboard = (
              "https://www.app.aisensy.com/projects/"
              "6589906ef69fc70b424e0e43/dashboard"
          )

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(storage_state=state)
              page = context.new_page()

              page.goto(
                  dashboard,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(10000)

              if "/login" in page.url:
                  raise RuntimeError("Session expired or login required.")

              print("Dashboard URL reached.")

              # Print a short preview of visible page text.
              # Avoid printing authentication data or page HTML.
              text = page.locator("body").inner_text(timeout=15000)
              preview = text[:2000]

              print("Dashboard text preview:")
              print(preview)

              browser.close()
          PY
