name: Test Cloud Browser

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test AiSensy Cloud Browser
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              page = browser.new_page()

              print("Starting AiSensy connection test...")

              try:
                  page.goto(
                      "https://backend.aisensy.com",
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  print("AiSensy page URL:", page.url)
                  print("AiSensy page title:", page.title())

                  print("SUCCESS: AiSensy website is accessible!")

              except Exception as e:
                  print("ERROR: Unable to access AiSensy.")
                  print("Error details:", str(e))
                  raise

              finally:
                  browser.close()
          PY
