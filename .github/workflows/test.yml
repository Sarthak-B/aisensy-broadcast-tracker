name: Export AiSensy Broadcast Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: read

concurrency:
  group: aisensy-broadcast-sync
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright google-auth google-api-python-client
          python -m playwright install --with-deps chromium

      - name: Sync AiSensy broadcasts to Google Sheets
        env:
          AISENSY_SESSION: ${{ secrets.AISENSY_SESSION }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}

        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          from datetime import datetime, timezone

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from playwright.sync_api import sync_playwright

          PROJECT_ID = "6589906ef69fc70b424e0e43"
          BASE = f"https://www.app.aisensy.com/projects/{PROJECT_ID}"
          LIST_URL = BASE + "/campaigns/all"
          SHEET_NAME = "Broadcast_Data"

          MAX_CAMPAIGNS = 50
          MAX_PAGES = 5

          CAMPAIGN_PATTERN = re.compile(
              r"(?m)^([^\n]+)\n"
              r"BROADCAST\n\n?"
              r"([A-Za-z]{3} \d{1,2}, \d{4}, "
              r"\d{1,2}:\d{2} [AP]M)"
          )

          def lines_from_page(page):
              return [
                  line.strip()
                  for line in page.locator("body").inner_text().splitlines()
                  if line.strip()
              ]

          def field_after(lines, label):
              for index, line in enumerate(lines[:-1]):
                  if line.lower() == label.lower():
                      return lines[index + 1]
              return ""

          def metric(lines, label):
              values = []

              for index, line in enumerate(lines[:-1]):
                  if line.lower() != label.lower():
                      continue

                  value = lines[index + 1]

                  if re.fullmatch(r"[\d,]+", value):
                      values.append(int(value.replace(",", "")))

              if not values:
                  raise ValueError(f"Missing metric: {label}")

              return values[-1]

          def actual_cost(lines):
              for index, line in enumerate(lines[:-1]):
                  if line != "Total Credit Usage":
                      continue

                  match = re.fullmatch(
                      r"₹\s*([\d,]+(?:\.\d+)?)",
                      lines[index + 1]
                  )

                  if match:
                      return float(
                          match.group(1).replace(",", "")
                      )

              raise ValueError("Missing Total Credit Usage")

          def actual_failed(text):
              patterns = [
                  r"\(\s*([\d,]+)\s*\)\s*Failed\b",
                  r"\bFailed\s*\(\s*([\d,]+)\s*\)",
                  r"\bFailed\s*\n\s*([\d,]+)\s*(?:\n|$)",
              ]

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      text,
                      re.IGNORECASE
                  )

                  if match:
                      return int(
                          match.group(1).replace(",", "")
                      )

              raise ValueError("Missing actual Failed count")

          def campaign_date(lines):
              value = field_after(lines, "Created At")

              if not value:
                  return ""

              try:
                  return datetime.strptime(
                      value,
                      "%b %d, %Y, %I:%M %p"
                  ).strftime("%Y-%m-%d")
              except ValueError:
                  return ""

          def page_indicator(page):
              text = page.locator("body").inner_text()

              match = re.search(
                  r"(\d+)\s*-\s*(\d+)\s+of\s+([\d,]+)",
                  text
              )

              if not match:
                  return ""

              return match.group(0)

          def read_campaign_names(page):
              text = page.locator("body").inner_text()
              names = []

              for match in CAMPAIGN_PATTERN.finditer(text):
                  name = match.group(1).strip()

                  if name and name not in names:
                      names.append(name)

              return names

          def wait_for_campaign_names(page, timeout=20000):
              deadline = time.monotonic() + timeout / 1000

              while time.monotonic() < deadline:
                  names = read_campaign_names(page)

                  if names:
                      return names

                  page.wait_for_timeout(500)

              return []

          def wait_for_list(page):
              page.get_by_text(
                  "Rows per page:",
                  exact=False
              ).first.wait_for(timeout=30000)

              names = wait_for_campaign_names(page)

              if not names:
                  raise RuntimeError(
                      "Campaign list loaded but no "
                      "broadcast names appeared."
                  )

              return names

          def go_to_list(page):
              page.goto(
                  LIST_URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              return wait_for_list(page)

          def click_next_page(page):
              previous = page_indicator(page)

              if not previous:
                  return False

              clicked = page.evaluate(
                  """() => {
                    const elements =
                      [...document.querySelectorAll("*")];

                    const label = elements.find(
                      el =>
                        el.children.length === 0 &&
                        (el.textContent || "").trim() ===
                        "Rows per page:"
                    );

                    if (!label) return false;

                    let parent = label;

                    for (let depth = 0; depth < 6; depth++) {
                      parent = parent.parentElement;

                      if (!parent) break;

                      const buttons = [
                        ...parent.querySelectorAll("button")
                      ];

                      if (buttons.length < 2) continue;

                      const next = buttons[buttons.length - 1];

                      if (
                        next.disabled ||
                        next.getAttribute("aria-disabled")
                        === "true"
                      ) {
                        return false;
                      }

                      next.click();
                      return true;
                    }

                    return false;
                  }"""
              )

              if not clicked:
                  return False

              try:
                  page.wait_for_function(
                      """previous => {
                        const text =
                          document.body.innerText || "";

                        const match = text.match(
                          /\\d+\\s*-\\s*\\d+\\s+of\\s+[\\d,]+/
                        );

                        return match &&
                          match[0] !== previous;
                      }""",
                      arg=previous,
                      timeout=15000
                  )
              except Exception:
                  print(
                      "Pagination indicator did not change."
                  )
                  return False

              return True

          def discover_campaign_names(page):
              go_to_list(page)

              all_names = []

              for page_number in range(1, MAX_PAGES + 1):
                  indicator = page_indicator(page)

                  # Important: pagination can update before
                  # AiSensy's campaign cards finish rendering.
                  names = wait_for_campaign_names(
                      page,
                      timeout=20000
                  )

                  print(
                      f"Page {page_number}: "
                      f"{indicator or 'unknown range'}, "
                      f"{len(names)} broadcasts",
                      flush=True
                  )

                  if not names:
                      print(
                          "No campaign names found on this "
                          "page. Keeping earlier results.",
                          flush=True
                      )
                      break

                  for name in names:
                      if name not in all_names:
                          all_names.append(name)

                  if len(all_names) >= MAX_CAMPAIGNS:
                      break

                  if page_number == MAX_PAGES:
                      break

                  if not click_next_page(page):
                      print(
                          "Could not advance pagination. "
                          "Keeping discovered campaigns.",
                          flush=True
                      )
                      break

              print(
                  f"Discovered {len(all_names)} "
                  f"unique broadcast names",
                  flush=True
              )

              if not all_names:
                  raise RuntimeError(
                      "No broadcast campaigns discovered."
                  )

              return all_names[:MAX_CAMPAIGNS]

          def open_campaign(page, name):
              go_to_list(page)

              for page_number in range(1, MAX_PAGES + 1):
                  names = wait_for_campaign_names(
                      page,
                      timeout=20000
                  )

                  if name in names:
                      target = page.get_by_text(
                          name,
                          exact=True
                      ).first

                      target.click(timeout=15000)

                      page.wait_for_url(
                          re.compile(
                              r"/campaigns/all/view/[^/]+"
                          ),
                          timeout=20000
                      )

                      return page.url

                  if page_number == MAX_PAGES:
                      break

                  if not click_next_page(page):
                      break

              raise ValueError(
                  f"Could not find campaign: {name}"
              )

          def extract_campaign(page, url, name):
              page.goto(
                  url,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.get_by_text(
                  "Total Credit Usage",
                  exact=True
              ).first.wait_for(timeout=30000)

              page.wait_for_timeout(1000)

              text = page.locator("body").inner_text()

              lines = [
                  line.strip()
                  for line in text.splitlines()
                  if line.strip()
              ]

              campaign_type = field_after(
                  lines,
                  "Campaign Type"
              ).upper()

              if campaign_type != "BROADCAST":
                  return None

              audience = metric(lines, "Audience")
              sent = metric(lines, "Sent")
              delivered = metric(lines, "Delivered")
              read = metric(lines, "Read")
              failed = actual_failed(text)
              cost = actual_cost(lines)

              if not (
                  audience >= sent >= delivered >= 0
              ):
                  raise ValueError("Invalid message counts")

              if not 0 <= read <= delivered:
                  raise ValueError("Invalid read count")

              if not 0 <= failed <= audience:
                  raise ValueError("Invalid failed count")

              if cost < 0:
                  raise ValueError("Invalid credit usage")

              return {
                  "id": url.rstrip("/").split("/")[-1],
                  "name": name,
                  "date": campaign_date(lines),
                  "type": campaign_type,
                  "audience": audience,
                  "sent": sent,
                  "delivered": delivered,
                  "read": read,
                  "failed": failed,
                  "cost": cost
              }

          # Load AiSensy session securely from GitHub.
          state = json.loads(
              os.environ["AISENSY_SESSION"]
          )

          campaigns = []
          errors = []

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  storage_state=state
              )

              page = context.new_page()

              names = discover_campaign_names(page)

              for index, name in enumerate(names, start=1):
                  print(
                      f"[{index}/{len(names)}] "
                      f"Processing {name}",
                      flush=True
                  )

                  try:
                      url = open_campaign(page, name)

                      data = extract_campaign(
                          page,
                          url,
                          name
                      )

                      if data:
                          campaigns.append(data)

                          print(
                              f"Extracted {name}: "
                              f"sent={data['sent']}, "
                              f"delivered={data['delivered']}, "
                              f"read={data['read']}, "
                              f"failed={data['failed']}, "
                              f"cost=INR {data['cost']}",
                              flush=True
                          )

                  except Exception as error:
                      errors.append(name)

                      print(
                          f"Skipped {name}: "
                          f"{type(error).__name__}: "
                          f"{str(error)[:180]}",
                          flush=True
                      )

              browser.close()

          if not campaigns:
              raise RuntimeError(
                  "No valid campaigns extracted. "
                  "Google Sheets was not modified."
              )

          # Connect to Google Sheets.
          credentials = (
              service_account.Credentials
              .from_service_account_info(
                  json.loads(
                      os.environ[
                          "GOOGLE_SERVICE_ACCOUNT_JSON"
                      ]
                  ),
                  scopes=[
                      "https://www.googleapis.com/auth/spreadsheets"
                  ]
              )
          )

          service = build(
              "sheets",
              "v4",
              credentials=credentials,
              cache_discovery=False
          )

          spreadsheet_id = os.environ[
              "GOOGLE_SHEET_ID"
          ]

          sheets = service.spreadsheets()

          response = sheets.values().get(
              spreadsheetId=spreadsheet_id,
              range=f"'{SHEET_NAME}'!A2:A"
          ).execute()

          existing = response.get("values", [])

          existing_ids = {}

          for index, row in enumerate(existing, start=2):
              if row and row[0]:
                  existing_ids[row[0]] = index

          next_row = len(existing) + 2

          updates = []

          now = datetime.now(
              timezone.utc
          ).isoformat()

          for campaign in campaigns:
              campaign_id = campaign["id"]

              if campaign_id in existing_ids:
                  row = existing_ids[campaign_id]
                  action = "UPDATE"

              else:
                  row = next_row
                  next_row += 1

                  existing_ids[campaign_id] = row
                  action = "INSERT"

              updates.extend([
                  {
                      "range": (
                          f"'{SHEET_NAME}'!A{row}:I{row}"
                      ),
                      "values": [[
                          campaign["id"],
                          campaign["name"],
                          campaign["date"],
                          campaign["type"],
                          campaign["audience"],
                          campaign["sent"],
                          campaign["delivered"],
                          campaign["read"],
                          campaign["failed"]
                      ]]
                  },
                  {
                      "range": (
                          f"'{SHEET_NAME}'!J{row}:K{row}"
                      ),
                      "values": [[
                          f"=IFERROR(G{row}/F{row},0)",
                          f"=IFERROR(H{row}/G{row},0)"
                      ]]
                  },
                  {
                      "range": (
                          f"'{SHEET_NAME}'!M{row}:O{row}"
                      ),
                      "values": [[
                          (
                              f'=IF(OR(G{row}="",'
                              f'L{row}=""),"",'
                              f'G{row}*L{row})'
                          ),
                          campaign["cost"],
                          now
                      ]]
                  }
              ])

              print(
                  f"{action}: {campaign['name']} "
                  f"-> row {row}",
                  flush=True
              )

          sheets.values().batchUpdate(
              spreadsheetId=spreadsheet_id,
              body={
                  "valueInputOption": "USER_ENTERED",
                  "data": updates
              }
          ).execute()

          print(
              f"SUCCESS: Updated "
              f"{len(campaigns)} broadcasts "
              f"in Google Sheets",
              flush=True
          )

          if errors:
              print(
                  f"WARNING: {len(errors)} "
                  f"campaign(s) were skipped.",
                  flush=True
              )
          PY
